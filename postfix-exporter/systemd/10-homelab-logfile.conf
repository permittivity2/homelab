# Managed by homelab-postfix-exporter.
#
# Debian's unit passes --systemd.enable, so the exporter reads the journal. On
# the fleet's mail nodes Postfix logs to /var/log/mail.log and the journal
# holds almost nothing, so every counter stayed at 0 while postfix_up said 1.
# Read the log file instead (the unit already adds the exporter to group adm,
# which can read it).
[Service]
ExecStart=
ExecStart=/usr/bin/prometheus-postfix-exporter --postfix.logfile_path=/var/log/mail.log $ARGS
