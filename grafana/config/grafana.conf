# homelab-grafana deployment parameters (sourced by the postinst to
# generate Grafana's systemd env drop-in). Change + reinstall (or
# dpkg-reconfigure homelab-grafana) to apply.
#
# PUBLIC_ROOT_URL: the public URL that fronts the embedded Grafana -- the
#   accountmanage /grafana sub-path. Grafana serves from this sub-path.
# AUTH_PROXY_WHITELIST: the IP(s) of the host(s) allowed to assert the
#   X-WEBAUTH-USER auth-proxy header -- i.e. the accountmanage pool. Grafana
#   trusts the header ONLY from these, and the fleet firewall only opens
#   :3000 to them anyway (defence in depth).
#   COMMA-separated. The value lands in a systemd Environment= line, which
#   splits on whitespace: a space-separated list silently keeps only the
#   FIRST address and the other accountmanage nodes cannot sign in to
#   Grafana (found 2026-10-28). The postinst normalises spaces and
#   semicolons to commas, so either form works from here on.
PUBLIC_ROOT_URL="https://myaccount.mailmasker.org/grafana/"
AUTH_PROXY_WHITELIST="10.50.2.171,10.50.2.172,10.50.2.173"
