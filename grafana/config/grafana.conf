# homelab-grafana deployment parameters (sourced by the postinst to
# generate Grafana's systemd env drop-in). Change + reinstall to apply.
#
# PUBLIC_ROOT_URL: the public URL that fronts the embedded Grafana -- the
#   accountmanage /grafana sub-path. Grafana serves from this sub-path.
# AUTH_PROXY_WHITELIST: the IP(s) of the host(s) allowed to assert the
#   X-WEBAUTH-USER auth-proxy header -- i.e. the accountmanage host. Grafana
#   trusts the header ONLY from these, and the fleet firewall only opens
#   :3000 to them anyway (defence in depth).
PUBLIC_ROOT_URL="https://myaccount.test.mailmasker.org/grafana/"
AUTH_PROXY_WHITELIST="10.50.2.61"
