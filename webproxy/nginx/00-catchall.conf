# Catch-all for Host/SNI names this edge has no vhost for.
#
# WHY THIS EXISTS. Every domain the fleet is authoritative for points its
# apex A record at this edge, but only the vhosts listed in sites.yml get a
# server block. Before this file, the leftovers fell through to whatever
# nginx happened to pick:
#
#   http://<unconfigured>/   -> Ubuntu's stock "Welcome to nginx!" page,
#                               HTTP 200, advertising the nginx version.
#   https://<unconfigured>/  -> the FIRST :443 server in config order, which
#                               is alphabetical within sites-enabled, so
#                               every unconfigured name was served
#                               api.mailmasker.org's certificate. A browser
#                               hard-fails that with a name mismatch.
#
# Measured 2026-10-27: 13 live domains in that state (dvddb.org,
# exittenwest.{com,net,org}, forgefamily.org, giraffenow.org, jhridge.com,
# smartwarehousing.org, superchump.{com,net,org}, thedude.vip, veilmail.us)
# -- all of them real MAIL domains whose websites no longer exist.
#
# This also covers the window between pointing a new domain's DNS here and
# adding its vhost, which is otherwise the same two faults.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Don't advertise the version to something that reached us by accident.
    server_tokens off;

    # 404, not a redirect and not 444: a flat refusal is honest, and unlike
    # a dropped connection it is diagnosable from the other end.
    return 404;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    # ssl_reject_handshake (nginx >= 1.19.4) aborts the TLS handshake with
    # unrecognized_name instead of presenting a certificate issued for some
    # OTHER vhost. That distinction is the whole point: serving a valid cert
    # for the wrong name is a hard browser error AND looks like a
    # misconfiguration of the name that IS on the cert. No certificate
    # directive is needed or wanted here.
    ssl_reject_handshake on;
}
