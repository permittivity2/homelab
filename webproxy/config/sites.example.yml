# Copy to /etc/homelab/webproxy/sites.yml and edit. Re-run
# `homelab-webproxy-apply-sites` (or just reinstall/reconfigure the
# package) after adding a new site — it's idempotent, only touches
# sites that don't already have a vhost.
letsencrypt_email: YOUR_EMAIL_HERE

# Every apply run also writes /etc/homelab/services/webproxy.yml, one
# entry per site below (with `fronts` naming its real upstream) --
# homelab-agent (if installed on this host) picks that up and reports
# it to homelab-api, visible via `homelab-cli fleet status`. No config
# needed here for that -- homelab-agent already knows this host's own
# identity from its own config. Skipped (with a note, not an error) if
# /etc/homelab/services doesn't exist yet, i.e. homelab-agent isn't
# installed on this host.

sites:
  # max_body_size raises this vhost's client_max_body_size (default
  # 100m) AND makes nginx stream large request bodies to the upstream
  # instead of buffering them to its own temp first, with long timeouts
  # -- needed for drive's 4GB uploads. Set it on both the drive vhost
  # (browser uploads) and the api vhost below (homelab-cli uploads go
  # through homelab-api's /api/v1/drive gateway). See
  # homelab-webproxy-apply-sites.
  - domain: drive.test.mailmasker.org
    upstream: 127.0.0.1:2501
    max_body_size: 5g
  - domain: mail.test.mailmasker.org
    upstream: 127.0.0.1:8080
  # homelab-api is deliberately public, not just an internal service --
  # it's the interface homelab-cli (and anyone's own scripts) uses from
  # OUTSIDE this network. See api/README.md. Requires
  # MOJO_REVERSE_PROXY=1 in homelab-api's own systemd unit (already set)
  # so its per-IP rate limiting sees real client IPs instead of this
  # proxy's own loopback address.
  - domain: api.test.mailmasker.org
    upstream: 127.0.0.1:3000
    max_body_size: 5g
