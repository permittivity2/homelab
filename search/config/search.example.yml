# Homelab Search Configuration
#
# The indexer reads the mail and drive stores through READ-ONLY NFS mounts
# and writes a normalized index into the `search` schema. Phase 2 adds the
# web app; this file already carries both halves' settings.

# RUNTIME connection -- CRUD only, no DDL. Point this at pgbouncer.
#
# The indexer uses this role too: indexing is INSERT/UPDATE/DELETE, which is
# CRUD, so it needs no DDL. It marks its own transactions with
# `homelab.indexer = 'on'` to pass the row-level security policy that
# otherwise scopes every table to one account -- see migrations/001-search.sql.
database:
  host: YOUR_PGBOUNCER_HOST
  port: 6432
  name: homelab
  user: homelab_search_runtime
  password: YOUR_RUNTIME_PASSWORD_HERE

# MIGRATE connection -- direct to Postgres, bypassing pgbouncer. Only used
# by homelab-search-migrate at install/upgrade time.
database_migrate:
  host: YOUR_POSTGRES_HOST
  port: 5432
  name: homelab
  user: homelab_search_migrate
  password: YOUR_MIGRATE_PASSWORD_HERE

# READ-ONLY. The drive index is driven from drive's own tables rather than
# by walking the storage directory: that is exact (deletions and restores
# are visible) and it keeps the rule that the storage directory is never
# enumerated. A narrow read-only role is enough.
drive_database:
  host: YOUR_PGBOUNCER_HOST
  port: 6432
  name: homelab
  user: homelab_search_runtime
  password: YOUR_RUNTIME_PASSWORD_HERE

# The read-only mounts. These must be mounted `ro` AND exported `ro=` by the
# NAS -- a client-side mount option is a promise the client makes to itself.
# See install-orchestrators/search-hosts-nfs.sh.
mail_root:  /srv/mail-ro
drive_root: /srv/drive-ro

indexer:
  # Seconds to wait after a pass that found nothing. The fast path is a stat
  # per mailbox, so this can be short without being expensive.
  idle_sleep_seconds: 15
  # Pause between units. 0 is right while the queue is the bottleneck; raise
  # it if the NAS or the Patroni primary is.
  busy_sleep_seconds: 0
  max_units_per_pass: 1000

# homelab-sso is the only place a user ever types a password. This app
# redirects here for /login and /logout.
#
# base_url is a BROWSER redirect target and must be the PUBLIC SSO vhost;
# internal_base_url is this app's own server-to-server exchange_code() call
# and should be SSO's internal address. Getting these the same way round as
# every other relying party matters -- see homelab-drive's config for the
# incident where base_url was set to the internal address: server-to-server
# worked, browser redirects did not, and fixing it the obvious way broke the
# other side.
sso:
  base_url: YOUR_SSO_BASE_URL_HERE
  internal_base_url: YOUR_SSO_INTERNAL_BASE_URL_HERE
  client_id: search
  client_secret: YOUR_SSO_CLIENT_SECRET_HERE
  redirect_uri: https://search.mailmasker.org/oauth/callback

# This instance's own PUBLIC address.
public_base_url: https://search.mailmasker.org

homelab_api:
  base_url: http://api.svc.homelab:3000

# Session cookie signing secret -- CHANGE THIS.
session:
  secret: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS"

# No web_theme block: homelab-webtheme already defaults to the right URL
# (https://static.mailmasker.org/theme/v1 -- the version is in the path), and
# nothing else overrides it. Restating a default here is how it drifts.

# Where this node advertises itself in homelab-api's service registry, which
# is what the gateway route /api/v1/search resolves to reach this host.
#
# Registered by homelab-search-register (a timer running as `homelab`), NOT
# by the web app: registration needs a system_agent credential and the app
# runs as vmail precisely so it cannot hold one. See that script's header.
#
# host is PER NODE -- the three hosts share this config otherwise, so the
# orchestrator rewrites this line after copying it.
registry:
  host: 10.50.2.214
  port: 2517

log_level: info

server:
  listen: "http://0.0.0.0:2517"
  workers: 2
  # In the runtime directory systemd creates for this unit, because the
  # service runs as vmail and /var/lib/homelab belongs to homelab.
  pid_file: /run/homelab-search/hypnotoad.pid
