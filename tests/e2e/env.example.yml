# Copy to env.yml (gitignored) and point at whichever environment you're
# validating against. No secrets belong here — hostnames/ports only.
#
# `test101`/`test102`/`test103`/`test-static-internet-ip` (the previous
# defaults here) no longer exist as SSH aliases as of 2026-09-25 -- this
# suite went unrun long enough for the target environment to be rebuilt
# out from under it. `ct-fleet` below is the current real replacement:
# the `homelab` repo's ct0x test fleet (~/.ssh/config.d/*.conf).
targets:
  ct-fleet:
    public_hostname: test.mailmasker.org
    # Any always-on host works for shelling out (homelab-cli register,
    # etc.) -- ct02 (runs homelab-api itself) is a reasonable default.
    # Must have homelab-cli installed and configured with an INTERNAL
    # api_base (e.g. http://127.0.0.1:3000, or homelab-api's own
    # internal IP:port if ssh_host doesn't run homelab-api itself) --
    # NOT the public https://api.<domain> URL: a host inside the fleet
    # trying to reach the fleet's own public hostname has to hairpin
    # back out through the edge proxy to reach itself/a sibling host,
    # which this network doesn't support (confirmed live 2026-09-25,
    # the same failure mode found and fixed for homelab-roundcube's own
    # oauth_token_uri/oauth_identity_uri -- see roundcube/README.md).
    ssh_host: homelab-ct02
    # Optional. When set, ALL of this suite's outbound HTTPS connections
    # are transparently routed through an SSH local port-forward to this
    # host's own loopback:443, instead of this runner's own direct
    # egress -- see conftest.py's _tunnel_egress fixture for exactly how
    # and why. Leave unset if the runner's own network reaches the
    # fleet's public IP reliably; only needed to work around a flaky
    # runner-side egress path (confirmed, independently, to be this
    # admin workstation's own issue on 2026-09-26 -- a real DHCP lease
    # renewal on its egress VLAN, nothing to do with the fleet).
    tunnel_via: homelab-ct00-internet-facing
    # The real HAProxy frontend real IMAP clients (including
    # homelab-roundcube itself) connect through, load-balanced across
    # the current 3-node Dovecot pool -- NOT ssh_host's own loopback,
    # which may not even run Dovecot. Confirm with `homelab-cli admin
    # fleet status` (look for the haproxy-imaps_in row) if this ever
    # needs updating; the IP is the internal VIP HAProxy binds, not any
    # one pool member's own address.
    imaps_vip: "10.50.2.44:993"
    # SSH jump host for the IMAPS tunnel specifically -- deliberately
    # NOT ssh_host (ct02): confirmed live (2026-09-25) that ct02's own
    # egress firewall has no rule permitting it to reach port 993 at
    # all (a raw TCP connect from there just hangs -- packet-level
    # drop, not a connection refusal). ct00 is the HAProxy host itself,
    # so it always has a legitimate, already-working path to its own
    # frontend.
    haproxy_host: homelab-ct00-internet-facing
    # Postfix's own virtual_transport target for LMTP delivery -- NOT
    # pooled/load-balanced at all (confirmed live: `postconf -h
    # virtual_transport` returns one fixed host:port, unlike IMAPS
    # above). This is genuinely what real inbound mail delivery uses
    # today; if it's ever pointed at a different Dovecot host, update
    # this to match (check any homelab-postfix host's own
    # `postconf -h virtual_transport`).
    lmtp_target: "10.50.2.52:24"
    # SSH jump host for the LMTP tunnel -- a real Postfix host (its own
    # virtual_transport is the actual, legitimate caller of lmtp_target
    # in this fleet), not ssh_host or haproxy_host, neither of which
    # has any real reason to reach LMTP's port 24 and (confirmed same
    # class of egress-firewall gap as imaps_vip above) don't.
    postfix_host: homelab-ct05
    # One real Dovecot pool member, for checks that need to run a real
    # command ON a Dovecot host (doveadm) rather than speak IMAP/LMTP to
    # it -- any pool member works interchangeably here since they share
    # the same SQL passdb/userdb config, this just needs to be one that
    # actually exists (see homelab-cli admin fleet status for the
    # current pool membership).
    dovecot_host: homelab-ct08

# Which entry above the suite runs against by default.
active_target: ct-fleet
