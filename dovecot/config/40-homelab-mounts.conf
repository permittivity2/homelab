# Post-cutover #41 F: never serve a bare mountpoint. The mail store is an
# NFS mount at /var/mail/vhosts on the fleet; RequiresMountsFor makes dovecot
# wait for that mount and refuse to start when the mount failed. On a host
# where /var/mail/vhosts is a plain directory this adds nothing. The BindsTo
# that also STOPS dovecot when the mount goes away names the host's mount
# unit and is written by nfs-mounts-orchestrate.sh beside this file.
[Unit]
RequiresMountsFor=/var/mail/vhosts
