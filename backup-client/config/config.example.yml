# /etc/homelab/backup/client/config.yml
#
# Installed with mode 600, owned by root:root (may contain a plaintext
# encryption passphrase). Copied here from config.example.yml by install.sh
# on first install; install.sh will not overwrite an existing config.yml.

# --- Identity -----------------------------------------------------------
# Optional override for the host identifier used in the repo path on the
# backup server. Leave blank to auto-derive:
#   "<system-hostname>-<contents of /etc/machine-id>"
# If /etc/machine-id can't be read and this is blank, the script logs to
# journald and exits cleanly (exit 0) rather than backing up under an
# unstable/ambiguous identifier.
hostname: ""

# --- Backup server ----------------------------------------------------------
# All three fields below are optional -- if backup_server is left blank,
# it (and ssh_backup_server_username/backup_server_location) are
# auto-discovered via `homelab-cli backup server-info` at run time
# (see homelab_cli: below), which is what most hosts should leave in
# place. Set backup_server explicitly to hardcode a server and skip
# discovery entirely -- useful if you want this host to keep working
# even during a homelab-api outage, or don't want to depend on
# homelab-api at all (see homelab_cli.disabled below).
backup_server: ""

# SSH user on the backup server. Defaults to "borgbackup" if unset/blank
# (and if not overridden by discovery).
ssh_backup_server_username: borgbackup

# Base directory on the backup server under which this host's own repo
# lives (repo path becomes <this>/<identifier>). Defaults to
# /var/borgbackup if unset/blank (and if not overridden by discovery).
# Must match the backup_location configured on the homelab-backup-server
# package (see its config.yml).
backup_server_location: /var/borgbackup

# During `setup`, after submitting this host's enrollment, opportunistically
# try to SSH into the backup server (using YOUR OWN ambient SSH identity/
# config, not this host's dedicated backup key) and trigger its
# reconciliation job immediately, instead of waiting out its poll interval
# (default every 15s -- see homelab-backup-server's own config.yml). Only
# works if you happen to already have your own SSH/sudo access to that
# host; silently does nothing otherwise, and the reconciliation timer
# covers it regardless. Set to false to skip attempting this entirely.
kick_reconcile: true

# --- Control plane (homelab-api / homelab-cli) -----------------------------
# Used for two things: (1) enrolling this host's SSH pubkey with the
# backup server via a poll/reconcile loop instead of a manual admin
# `enroll` command, and (2) reporting each backup/check run's outcome
# for later visibility (`homelab-cli backup host-runs <identifier>`),
# and discovering backup_server/etc. above when left blank. Set up by
# install.sh's setup_control_plane() -- see that script and the
# package's README for the full flow.
homelab_cli:
  # This host's own isolated homelab-cli session directory -- never the
  # default ~/.config/homelab-cli, so this service account's session.json
  # never collides with an interactively-logged-in human's.
  config_dir: /etc/homelab/backup/client/homelab-cli
  api_url: ""
  # May be shared across every host in the fleet -- it doesn't matter
  # which login account is used, since the `identifier` field on every
  # request (never the JWT/email) is what disambiguates hosts.
  email: ""
  # Only ever used once, during setup, to obtain a session -- cleared
  # from this file immediately afterward (session.json persists the
  # credential from then on). Never left populated at rest.
  password: ""
  # true = fully offline client: no enrollment, no run-history
  # reporting, no server discovery. backup_server must then be set
  # explicitly above.
  disabled: false

# --- Encryption ------------------------------------------------------------
# A random per-host passphrase is generated by install.sh on first
# install (repos use borg's `repokey` encryption). Keep this file mode
# 600 root:root — this passphrase is the only thing standing between an
# attacker and every config/secret this host backs up.
#
# Once a repo is created, a `borg key export` (plus a `--paper` copy) is
# written to /etc/homelab/backup/client/key-escrow/ as a second safety
# net independent of this passphrase. Neither the passphrase nor the key
# export is replicated anywhere off this host automatically — copy both
# to a password manager/secrets vault AND an offline/paper copy. See the
# README's Disaster Recovery section.
#
# Leaving passphrase blank is a hard error unless allow_unencrypted is
# explicitly set to true — an unencrypted backup on a shared server can
# expose every secret this host backs up, so this should not be used
# outside of disposable test environments.
encryption:
  passphrase: ""
  allow_unencrypted: false

# --- Backup mode -------------------------------------------------------
# One of: full_host | local_only | homelab_only | specific
#
#   full_host    - everything on the host that can be backed up (source "/",
#                  excluding only pseudo-filesystems: /proc /sys /dev /run /tmp)
#   local_only   - same as full_host, but also excludes any mount point whose
#                  filesystem type is a network/virtual fs (nfs, cifs, sshfs,
#                  overlay, tmpfs, etc.) as reported by /proc/mounts
#   homelab_only - back up only what's listed under homelab_only: below
#                  (application configs + database dumps). Does NOT include
#                  end-user data (Drive files, mailboxes, etc.)
#   specific     - back up only what's listed under specific.paths: below
mode: full_host

specific:
  # Literal paths, or Borg pattern syntax (fm:/sh:/re: prefixes), used only
  # when mode: specific.
  paths: []

homelab_only:
  # Config directories/files for installed homelab-* services. install.sh
  # auto-populates this from every installed package's own
  # /usr/share/homelab-<pkg>/backup-paths.txt manifest -- no per-package
  # knowledge lives in this tool itself; any homelab-* package
  # participates just by shipping that file. Edit freely for anything
  # extra beyond what was auto-detected.
  paths: []
  # Extra, manually-configured databases to pg_dump (in ADDITION to
  # whatever /usr/share/homelab-*/backup-hook.sh scripts already ran --
  # see homelab-database's hook, which pg_dumpall's the whole cluster
  # automatically wherever homelab-database itself is installed). Use
  # this only for an ad hoc dump not already covered by a hook.
  databases: []
  #  - type: postgres
  #    name: mailserver
  #    dump_dir: /var/lib/homelab-backup-client/dumps

# Regex patterns (Python re syntax) excluded in ALL modes, translated to
# Borg "re:" pattern lines and applied on top of whatever the mode above
# already selects.
exclude: []
#  - '.*\.cache/.*'
#  - '/var/tmp/.*'

# --- Schedule ------------------------------------------------------------
# mode: hourly | daily | weekly | monthly | calendar | continuous
#
#   hourly     - maps directly to a systemd OnCalendar=hourly timer.
#   daily/weekly/monthly - fire once a day/week/month at a randomized
#                time of night rather than exactly at midnight, so a
#                whole fleet backing up to the same backup server
#                doesn't all connect at once. install.sh picks a random
#                hour (from window_hours below) and minute (0-59) ONCE
#                and persists it into start_hour/start_minute below;
#                re-running install.sh keeps reusing that same time
#                unless you clear both fields to force a re-roll.
#   calendar   - use `calendar:` below verbatim as a systemd OnCalendar=
#                expression (see `man systemd.time`), for crontab-like
#                schedules that don't fit the presets above. Not
#                randomized — you're specifying the exact time yourself.
#   continuous - no timer; a long-running service runs a backup, and as
#                soon as it completes, immediately starts the next one.
schedule:
  mode: daily
  calendar: ""

  # Candidate hours (24h, local time) for the randomized daily/weekly/
  # monthly start time. Default is an 11pm-3am window (23, 0, 1, 2 —
  # i.e. up to but not including 3am).
  window_hours: [23, 0, 1, 2]

  # Auto-picked once by install.sh from window_hours + a random minute;
  # leave blank on a fresh config. Clear both to re-roll a new time.
  start_hour: ""
  start_minute: ""

  # systemd RandomizedDelaySec (seconds) — an additional random delay
  # added on top of the scheduled time, for every timer-driven mode
  # (including hourly and calendar). Further smooths out clustering
  # beyond the once-per-host fixed start time above.
  jitter_seconds: 1800

# --- Retention (borg prune, run after every successful backup) -----------
retention:
  keep_daily: 7
  keep_weekly: 4
  keep_monthly: 6
  keep_yearly: 1

# --- Integrity check (borg check, run on its own schedule) ---------------
# A silently corrupted repo is only useful to discover *before* a real
# disaster recovery attempt needs it. This runs read-only (never
# --repair, which is a deliberate manual admin action) on its own timer
# separate from the backup schedule, since a full check is slower than a
# backup and shouldn't block it.
#
#   never    - no integrity_check timer is installed
#   weekly   - OnCalendar=weekly
#   monthly  - OnCalendar=monthly (default)
integrity_check:
  mode: monthly
