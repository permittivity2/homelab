# Homelab Drive Configuration
#
# A file-storage web UI (BFF pattern): browsers talk to this app, never
# directly to homelab-api or homelab-sso. Login is delegated entirely to
# homelab-sso (see sso: below) via an OAuth2-style authorization-code
# flow — this app never sees a password. The resulting access_token/
# refresh_token are held in this app's own signed session cookie, and
# re-verified against homelab-api's introspect on every request (see
# homelab_api: below) — a session cookie surviving doesn't mean the
# underlying token is still valid.

homelab_api:
  base_url: https://login.test.mailmasker.org   # wherever homelab-api is actually reachable

# homelab-sso is the only place a user ever types a password. This app
# redirects here for /login and /logout; postinst prompts for base_url
# and client_secret via debconf (the secret must match exactly what
# homelab-sso's own install printed for the "drive" client — see
# ../sso/README.md's "Wiring in a relying party").
sso:
  base_url: YOUR_SSO_BASE_URL_HERE
  client_id: drive
  client_secret: YOUR_SSO_CLIENT_SECRET_HERE
  redirect_uri: https://drive.test.mailmasker.org/oauth/callback

# RUNTIME connection — CRUD only, no DDL. Point this at pgbouncer.
database:
  host: YOUR_PGBOUNCER_HOST
  port: 6432
  name: homelab
  user: homelab_drive_runtime
  password: YOUR_RUNTIME_PASSWORD_HERE

# MIGRATE connection — direct to Postgres, bypassing pgbouncer. Only
# used by homelab-drive-migrate at install/upgrade time.
database_migrate:
  host: YOUR_POSTGRES_HOST
  port: 5432
  name: homelab
  user: homelab_drive_migrate
  password: YOUR_MIGRATE_PASSWORD_HERE

# Session cookie signing secret — CHANGE THIS.
session:
  secret: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS"

storage:
  path: /var/lib/homelab/drive-storage

# Thumbnail/slideshow-image generation for uploaded images (see
# README.md's "Image thumbnails and slideshow" section). All optional --
# every value below is this package's own built-in default if omitted.
image:
  thumbnail_geometry:  "200x200>"    # ImageMagick geometry; '>' = shrink only, never enlarge
  thumbnail_quality:   80            # JPEG quality, 0-100
  slideshow_geometry:  "1280x1280>"
  slideshow_quality:   82

# What this instance announces itself as in homelab-api's service
# registry (Homelab::Common::Registry) — the address OTHER features
# (and homelab-webproxy, eventually) would look it up by. Omit this
# section entirely to skip registration.
registry:
  host: 127.0.0.1
  port: 2501

server:
  listen: "http://0.0.0.0:2501"
  workers: 2
  pid_file: /var/lib/homelab/drive-hypnotoad.pid
