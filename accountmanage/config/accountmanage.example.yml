# Homelab Account Management configuration
#
# A thin BFF web app (same pattern as homelab-drive): the browser talks
# only to this app, which delegates login to homelab-sso (OAuth2
# authorization-code) and then aggregates calls to the existing services
# (homelab-api for account info/sessions, homelab-drive for storage
# usage, ...) using the logged-in user's own token. It owns no database.

server:
  listen: http://0.0.0.0:2503
  workers: 2

# Signed-session-cookie secret (holds OAuth login state). Use a long
# random string; changing it logs everyone out.
session:
  secret: CHANGE_ME_TO_A_LONG_RANDOM_STRING

# homelab-api is reached server-to-server for EVERY panel (introspect,
# account summary, sessions, and the /api/v1/drive/* gateway for drive
# usage). Point at wherever the api gateway is reachable from this host
# (an internal/data-plane address in the fleet).
homelab_api:
  base_url: http://127.0.0.1:3000

# This app's own public address.
public_base_url: https://myaccount.test.mailmasker.org

# Optional: the fleet Prometheus (monitoring host) the Metrics tab queries.
# Leave unset/empty to disable the Metrics tab entirely. The tab is further
# gated by the metrics.view capability (site_admin always has it; it can be
# granted to other roles via the Roles admin). This host needs egress to
# this host:port (the postinst opens it) and Prometheus must list this host
# in its METRICS_CONSUMERS.
prometheus:
  base_url: http://10.50.2.63:9090
# Optional: the fleet Grafana, reverse-proxied under /grafana so its full
# dashboards render INSIDE myaccount (same origin, so they work off-network
# and embed in the Metrics tab). metrics.view gated like the summary.
# Grafana must be configured for this sub-path + auth_proxy (homelab-grafana
# 0.2.0+ does this) and trust this host in GF_AUTH_PROXY_WHITELIST; the
# postinst opens egress to it.
grafana:
  base_url: http://10.50.2.63:3000

# Device setup -- the "Mail setup" panel every signed-in user gets, and
# the standalone page a phone lands on after scanning the QR code there.
#
# These are the hostnames and ports a MAIL CLIENT dials. They must be
# publicly resolvable AND appear as a SAN on the certificate the edge
# serves on those ports, or the phone fails the TLS name check with an
# error the user cannot act on. Blank derives mail.<domain>/smtp.<domain>
# from the signed-in user's own address, which is normally right.
device_setup:
  imap_host:
  imap_port: 993
  smtp_host:
  smtp_port: 587
  service_label: MailMasker
  organization: Silver Linings, LLC
  webmail_url: https://mail.mailmasker.org/
  # Minutes a scanned QR code stays usable. Short on purpose: unlike the
  # link in the welcome email, this one is generated while the person is
  # looking at the screen and is meant to be used within the minute.
  qr_ttl_minutes: 15
  # HMAC secret for those QR links. LEAVE BLANK: it then uses
  # session.secret, which is the only key this app already guarantees is
  # identical across the three-node pool (a cookie signed by one node has
  # to validate on the next). The token commits to its own purpose
  # string, so sharing the key does not let one be replayed as the other.
  # Set a value only if you would rather they did not share -- and then
  # set the SAME value on every node in the pool.
  token_secret:

# homelab-sso: the only place a user types a password.
sso:
  base_url: https://login.test.mailmasker.org        # BROWSER redirect target -- MUST be the public SSO vhost
  internal_base_url: http://127.0.0.1:2502            # server-to-server token exchange (defaults to base_url)
  client_id: accountmanage
  client_secret: YOUR_SSO_CLIENT_SECRET_HERE          # must match what homelab-sso registered for this client
  redirect_uri: https://myaccount.test.mailmasker.org/oauth/callback

# Announce this instance in homelab-api's service registry (needs
# homelab-agent enrolled on this host for the auth token). host = this
# host's own reachable/data-plane address; port = the listen port.
registry:
  host: 127.0.0.1
  port: 2503
