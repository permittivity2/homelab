# Post-cutover #41 (the first real pve2 reboot, 2026-11-23): this daemon's start
# ran past systemd's 90 s timeout while 66 guests booted off one disk, and the
# stock unit has Restart=no, so it stayed down until someone looked. A daemon
# that dies or times out comes back on its own now.
[Service]
Restart=on-failure
RestartSec=5
