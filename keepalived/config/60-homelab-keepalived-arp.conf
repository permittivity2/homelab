# Managed by homelab-keepalived.
#
# ARP hygiene for a multi-homed VIP host. arp_ignore=1 makes the host answer
# an ARP request for a local address only on the interface that actually owns
# that address (so a public VIP resolves to its own macvlan/reservation MAC,
# never leaking a different interface's MAC); arp_announce=2 makes outgoing
# ARP use the best source address for the target subnet. Without these, a
# multi-homed edge node exhibits "ARP flux" -- the VIP intermittently resolves
# to the wrong interface's MAC and failover delivery breaks.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
