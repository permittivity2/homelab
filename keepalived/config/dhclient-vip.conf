# Managed by homelab-keepalived -- minimal dhclient config for notify-managed
# edge VIPs (passed via `dhclient -cf`). Deliberately tiny and independent of
# the host's /etc/dhcp/dhclient.conf so these VIP clients can never be changed
# by an unrelated edit to the host default. We request ONLY what the lease
# script applies (the address + its mask); we do NOT request routers,
# domain-name-servers, host-name, or classless-static-routes, and we do NOT
# `send host-name` (no leaking the node name to the upstream gateway). Even if
# the server volunteers routers/DNS, the custom -sf lease script ignores them.
request subnet-mask, broadcast-address;
timeout 20;
retry 60;
