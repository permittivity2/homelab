# Managed by homelab-keepalived.
#
# Guarantee the notify-managed public VIP macvlans are torn down whenever
# keepalived stops -- INCLUDING a crash/SIGKILL, where keepalived cannot run
# its own notify_stop hook. ExecStopPost runs after the main process exits no
# matter how it exited. Without this, a `systemctl stop` or OOM-kill of the
# master would leave its macvlan + reservation MAC + VIP in place while a peer
# promotes and builds the same MAC -- a persistent duplicate-MAC split on the
# public L2. The teardown is idempotent and a no-op when there are no notify
# VIPs (the spec file is absent), so it is safe on every node and every stop.
[Service]
ExecStopPost=/usr/bin/homelab-keepalived-notify backup
