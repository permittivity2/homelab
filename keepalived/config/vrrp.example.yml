# homelab-keepalived VRRP configuration.
# Edit this file, then run:  homelab-keepalived-apply
# (regenerates /etc/keepalived/keepalived.conf + the VRRP firewall drop-in,
#  then reloads keepalived).
#
# This node participates in a VRRP group that floats a public "virtual IP"
# (VIP) between two or more edge nodes. The healthy node with the highest
# priority owns the VIP; if it dies, a peer claims it -- keepalived sends a
# gratuitous ARP so the upstream gateway follows the IP to the new node's
# MAC, with no gateway reconfiguration.

enabled: true

instance: EDGE_PUBLIC          # VRRP instance name (identical on all peers)
router_id: 67                  # virtual_router_id 1-255, identical on all peers,
                               # unique vs any other VRRP group on this L2 segment
state: BACKUP                  # initial state; real role is decided by priority
priority: 100                  # HIGHER = preferred owner (e.g. 150 primary / 100 standby)

# VRRP advertisements travel on the INTERNAL service plane (NOT the public
# one), as unicast between the explicitly listed peers.
vrrp_interface: eth4           # interface carrying VRRP adverts
unicast_src: 10.50.2.44        # THIS node's IP on vrrp_interface
peers:                         # the OTHER node(s)' IP on their vrrp_interface
  - 10.50.2.77
auth_pass: hlvrrp              # shared secret (<=8 chars), identical on all peers

# There are TWO kinds of floating VIP, and a node may use either or both.
# Whichever node is master owns every VIP listed here; on failover they all
# move together with this single VRRP instance.
#
# 1) keepalived-managed VIPs (`vips:`) -- plain `virtual_ipaddress` entries.
#    keepalived adds the address to the given interface (using that
#    interface's own MAC) and sends a gratuitous ARP. Use this for internal
#    VIPs and for public VIPs where the host NIC's MAC is acceptable
#    upstream.
vips:
  - address: 10.50.2.140/22    # e.g. an internal service-plane VIP
    interface: eth4
# Single-VIP shorthand (original form, still supported):
#   vip: 23.116.91.67/24
#   vip_interface: eth5
#
# 2) notify-managed VIPs (`dhcp_vips:`) -- for a public IP that must present
#    a SPECIFIC MAC on the wire (an AT&T per-IP DHCP-reservation MAC) and/or
#    take its address via DHCP. keepalived cannot do this with
#    virtual_ipaddress (it would use the NIC's MAC, or a VRRP
#    00:00:5e:00:01:xx vMAC that pfSense/CARP rejects). Instead the
#    homelab-keepalived-notify hook builds a macvlan on `parent` carrying
#    `mac`, then runs dhclient on it (minimal lease script: address only, no
#    default route, no DNS). mode: dhcp = address comes purely from the
#    lease; static+dhcp = assign `address` immediately (instant failover)
#    AND run DHCP alongside to re-register the reservation MAC.
# dhcp_vips:
#   - name: pub66              # macvlan devname (<=15 chars)
#     parent: eth7             # public-L2 interface to parent the macvlan on
#     mac: bc:24:11:73:51:b4   # AT&T reservation MAC for this public IP
#     mode: dhcp               # dhcp | static+dhcp
#   - name: pub68
#     parent: eth6
#     mac: bc:24:11:8f:08:b4
#     mode: dhcp
#     # address: 23.116.91.68/24   # required only for a static+dhcp mode

# OPTIONAL master-only default route via the public gateway, installed on
# default_route_interface (or the first vip's interface if unset). Backups
# never get it. OMIT it entirely (as here) when the edge already egresses
# via its own LAN default route -- setting it would override that.
# default_route_via: 23.116.91.70
# default_route_interface: eth7

# Optional: fail the VIP over to a peer if any of these services stop on
# the current owner (not only if the whole node dies).
track_services:
  - nginx
  - haproxy
track_weight: -60              # priority penalty applied while a tracked service
                               # is down (must be big enough to drop this node
                               # below a healthy peer's priority)
