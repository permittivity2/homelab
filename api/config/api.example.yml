# Homelab API Configuration
#
# Identity/auth/RBAC + the service registry every other feature's
# Homelab::Common::Registry client calls. See CLAUDE.md for the full
# architecture.

# RUNTIME connection — CRUD only, no DDL. Point this at pgbouncer
# (default port 6432), not straight at Postgres.
database:
  host: YOUR_PGBOUNCER_HOST
  port: 6432
  name: homelab
  user: homelab_api_runtime
  password: YOUR_RUNTIME_PASSWORD_HERE

# MIGRATE connection — CRUD+DDL, used only by postinst at install/upgrade
# time via Homelab::Common::Migrate. Deliberately points DIRECTLY at
# Postgres, bypassing pgbouncer — see CLAUDE.md's split-role design.
# Not read by the running service at all outside of migrations.
database_migrate:
  host: YOUR_POSTGRES_HOST
  port: 5432
  name: homelab
  user: homelab_api_migrate
  password: YOUR_MIGRATE_PASSWORD_HERE

jwt:
  secret: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS"
  algorithm: HS256
  expiry_seconds: 1800        # 30 minutes
  refresh_expiry_days: 30

auth:
  # false (default): /api/v1/auth/register works exactly as it always
  # has, invite_token ignored if sent. true: an operator has installed
  # homelab-invite and wants self-registration gated behind it --
  # invite_token becomes mandatory and is verified via a
  # server-to-server call into homelab-invite before any account is
  # created. Flip this only after homelab-invite is installed and
  # registered (homelab-cli admin fleet status should show it), or
  # every registration attempt will fail closed with "invite service is
  # not currently available".
  require_invite: false

server:
  listen: "http://0.0.0.0:3000"
  # Each hypnotoad worker is a forked Perl/Mojolicious process; measured
  # live at ~49MB RSS apiece (fork() COW sharing means this is real
  # incremental cost, not fully shared). 8 was chosen for a 512MB/2-core
  # container specifically -- raising this without re-measuring actual
  # memory under a real combined-load burst (not just checking CPU
  # headroom) caused a genuine kernel OOM-kill of this service in
  # production testing at workers=20 (Failed with result 'oom-kill',
  # 500M peak + 450M swap peak). Scale this up only after confirming
  # `free -m` stays comfortably clear of the container's real RAM limit
  # under the heaviest realistic combined request pattern, not CPU alone.
  workers: 8
  pid_file: /var/lib/homelab/api-hypnotoad.pid
