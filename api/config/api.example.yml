# Homelab API Configuration
#
# Identity/auth/RBAC + the service registry every other feature's
# Homelab::Common::Registry client calls. See CLAUDE.md for the full
# architecture.

# RUNTIME connection — CRUD only, no DDL. Point this at pgbouncer
# (default port 6432), not straight at Postgres.
database:
  host: YOUR_PGBOUNCER_HOST
  port: 6432
  name: homelab
  user: homelab_api_runtime
  password: YOUR_RUNTIME_PASSWORD_HERE

# MIGRATE connection — CRUD+DDL, used only by postinst at install/upgrade
# time via Homelab::Common::Migrate. Deliberately points DIRECTLY at
# Postgres, bypassing pgbouncer — see CLAUDE.md's split-role design.
# Not read by the running service at all outside of migrations.
database_migrate:
  host: YOUR_POSTGRES_HOST
  port: 5432
  name: homelab
  user: homelab_api_migrate
  password: YOUR_MIGRATE_PASSWORD_HERE

jwt:
  secret: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_CHARS"
  algorithm: HS256
  expiry_seconds: 1800        # 30 minutes
  refresh_expiry_days: 30
  # How long a refresh token that has ALREADY been rotated stays redeemable,
  # returning the same successor it rotated into. Default 300.
  #
  # This exists because a rotation whose response is lost -- a timeout, a
  # reset connection, a client killed between the server's commit and its own
  # write to disk -- used to be unrecoverable: the old token was revoked and
  # the new one never arrived. For a human that is one re-login. For
  # homelab-agent, which holds no password, it was permanent, and it locked
  # out 14 of 51 fleet nodes on 2026-10-28/29. See
  # migrations/020-refresh-token-grace.sql for the full reasoning and the
  # four conditions that must all hold before anything is handed back.
  #
  # Lower is stricter. 0 disables the grace path entirely and restores the
  # old behaviour, lockouts included.
  refresh_grace_seconds: 300

auth:
  # true (default): /api/v1/auth/register needs an invite_token, which is
  # checked AND used up through homelab-invite before any account is made;
  # homelab-invite's own sign-up page sends it. Needs homelab-invite
  # installed and registered, or every registration fails closed with
  # "invite service is not currently available".
  #
  # false: anyone who can reach the api may create an account, for any
  # address, and an invite is never marked used. Only for a closed test
  # host. Production ran this way until 2026-11-03 (security fix; the
  # package's postinst flipped existing configs to true once).
  require_invite: true

server:
  listen: "http://0.0.0.0:3000"
  # Each hypnotoad worker is a forked Perl/Mojolicious process; measured
  # live at ~49MB RSS apiece (fork() COW sharing means this is real
  # incremental cost, not fully shared). 8 was chosen for a 512MB/2-core
  # container specifically -- raising this without re-measuring actual
  # memory under a real combined-load burst (not just checking CPU
  # headroom) caused a genuine kernel OOM-kill of this service in
  # production testing at workers=20 (Failed with result 'oom-kill',
  # 500M peak + 450M swap peak). Scale this up only after confirming
  # `free -m` stays comfortably clear of the container's real RAM limit
  # under the heaviest realistic combined request pattern, not CPU alone.
  workers: 8
  pid_file: /var/lib/homelab/api-hypnotoad.pid

# HA status view (accountmanage "HA" tab, GET /api/v1/admin/ha/status).
# Optional -- the handler falls back to this same code default if omitted.
# Point at the PostgreSQL HA nodes' Patroni REST (:8008) + the pgbouncer poolers.
postgres_ha:
  vip: 10.50.2.130
  rest_port: 8008
  nodes:
    - { name: prod-homelab06, address: 10.50.2.150 }
    - { name: prod-homelab07, address: 10.50.2.151 }
    - { name: prod-homelab08, address: 10.50.2.152 }
  pgbouncer:
    - { name: prod-homelab09, address: 10.50.2.153 }
    - { name: prod-homelab10, address: 10.50.2.154 }
    - { name: prod-homelab11, address: 10.50.2.155 }
