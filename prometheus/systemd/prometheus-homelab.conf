# Installed as /etc/systemd/system/prometheus.service.d/homelab.conf by
# homelab-prometheus. Overrides the stock Debian prometheus.service so it
# reads THIS deployment's config (which uses file_sd target files kept in
# sync with the fleet by homelab-prometheus-pull) instead of the default
# /etc/prometheus/prometheus.yml, and sets a sane TSDB retention.
# --web.enable-lifecycle lets the pull step POST /-/reload if ever needed
# (file_sd is auto-reloaded, so normally it isn't).
[Service]
ExecStart=
ExecStart=/usr/bin/prometheus --config.file=/etc/prometheus/homelab/prometheus.yml --storage.tsdb.path=/var/lib/prometheus/metrics2 --storage.tsdb.retention.time=30d --web.listen-address=0.0.0.0:9090 --web.enable-lifecycle
