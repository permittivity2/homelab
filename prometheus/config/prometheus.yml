# homelab-prometheus scrape config (pointed to by the prometheus.service
# systemd drop-in shipped with this package). Targets come from file_sd
# files under targets/, regenerated from the live fleet by
# homelab-prometheus-pull.timer -- do not hand-edit the target files.
#
# Adding a new exporter tier is two edits: a jobs: entry in pull.yml
# (feature + port) and a matching scrape job here pointing at its
# targets/<job>.json. A target file that doesn't exist yet (exporter not
# deployed) is created empty by the first pull, so no scrape errors.
#
# Every job also reads targets-static/<job>.json: hosts the fleet API does
# not know about (no homelab-agent), rendered by the postinst from
# STATIC_TARGETS in /etc/homelab/prometheus/config and never touched by the
# pull. ns03, the sole resolver, is scraped that way (post-cutover #66). A
# static file that doesn't exist is not an error to file_sd.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    fleet: homelab

# Alerting (post-cutover #38, 0.10.0): the Alertmanager this package installs
# and configures on this same host, loopback only. It mails the fleet's
# operator through the service mailbox (see alertmanager.yml.template) and
# the myaccount Metrics tab shows what is firing. Before 0.10.0 the rules
# below evaluated and surfaced only in Prometheus's own Alerts page --
# visible, but a node could still be dead for four days before anyone looked
# (see rules/fleet-agent.yml).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['127.0.0.1:9093']

# Alert rules.
# This MUST match the postinst's $PROM_DIR/rules -- prometheus.service runs with
# --config.file=/etc/prometheus/homelab/prometheus.yml, not the stock
# /etc/prometheus/prometheus.yml. A rule_files glob that matches nothing is NOT
# an error: prometheus starts clean with zero rule groups and says nothing. That
# is how 0.7.1 shipped alert rules that were never evaluated.
rule_files:
  - /etc/prometheus/homelab/rules/*.yml

scrape_configs:
  # Prometheus scraping itself.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Host metrics (node_exporter :9100) on every fleet host (+ static hosts).
  - job_name: node
    file_sd_configs:
      - files: ['/etc/prometheus/homelab/targets/node.json', '/etc/prometheus/homelab/targets-static/node.json']
        refresh_interval: 30s

  # PostgreSQL (postgres_exporter :9187) -- the DB host.
  - job_name: postgres
    file_sd_configs:
      - files: ['/etc/prometheus/homelab/targets/postgres.json', '/etc/prometheus/homelab/targets-static/postgres.json']
        refresh_interval: 30s

  # PgBouncer (pgbouncer_exporter :9127) -- the DB host.
  - job_name: pgbouncer
    file_sd_configs:
      - files: ['/etc/prometheus/homelab/targets/pgbouncer.json', '/etc/prometheus/homelab/targets-static/pgbouncer.json']
        refresh_interval: 30s

  # Postfix (postfix_exporter :9154) -- the mail-sending pool.
  - job_name: postfix
    file_sd_configs:
      - files: ['/etc/prometheus/homelab/targets/postfix.json', '/etc/prometheus/homelab/targets-static/postfix.json']
        refresh_interval: 30s

  # HAProxy native Prometheus exporter (:8404) -- the edge.
  - job_name: haproxy
    file_sd_configs:
      - files: ['/etc/prometheus/homelab/targets/haproxy.json', '/etc/prometheus/homelab/targets-static/haproxy.json']
        refresh_interval: 30s

  # dnsdist native Prometheus endpoint (:8083/metrics) -- the edge DNS
  # front. Its /metrics requires the webserver apiKey, sent as X-API-Key
  # (must match homelab-dnsdist's metrics_api_key default).
  - job_name: dnsdist
    http_headers:
      X-API-Key:
        values: ['homelab-dnsdist-metrics-ro']
    file_sd_configs:
      - files: ['/etc/prometheus/homelab/targets/dnsdist.json', '/etc/prometheus/homelab/targets-static/dnsdist.json']
        refresh_interval: 30s

  # PowerDNS native Prometheus endpoint (webserver :8081/metrics) -- the
  # authoritative tier.
  - job_name: pdns
    file_sd_configs:
      - files: ['/etc/prometheus/homelab/targets/pdns.json', '/etc/prometheus/homelab/targets-static/pdns.json']
        refresh_interval: 30s

  # PowerDNS Recursor native Prometheus endpoint (webserver :8082/metrics, no
  # api-key, gated by webserver-allow-from). Not a fleet feature, so the pull
  # never writes targets/pdns-recursor.json: ns03 comes from STATIC_TARGETS
  # (post-cutover #66, 2026-11-09). Alert rules in rules/resolver.yml.
  - job_name: pdns-recursor
    file_sd_configs:
      - files: ['/etc/prometheus/homelab/targets/pdns-recursor.json', '/etc/prometheus/homelab/targets-static/pdns-recursor.json']
        refresh_interval: 30s

  # Dovecot openmetrics (stats http listener :9900) -- the mailstore pool.
  - job_name: dovecot
    file_sd_configs:
      - files: ['/etc/prometheus/homelab/targets/dovecot.json', '/etc/prometheus/homelab/targets-static/dovecot.json']
        refresh_interval: 30s

  # nginx / web proxy (prometheus-nginx-exporter :9113) -- the edge.
  - job_name: nginx
    file_sd_configs:
      - files: ['/etc/prometheus/homelab/targets/nginx.json', '/etc/prometheus/homelab/targets-static/nginx.json']
        refresh_interval: 30s

  # External/public HTTPS probes via blackbox_exporter: availability
  # (probe_success) + TLS cert expiry (probe_ssl_earliest_cert_expiry) of
  # the public vhosts. The target list is shipped by
  # homelab-blackbox-exporter (blackbox-http.json); the relabel dance sends
  # each URL to the blackbox exporter as ?target= and keeps the URL as the
  # instance label.
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_public]
    file_sd_configs:
      - files: ['/etc/prometheus/homelab/targets/blackbox-http.json']
        refresh_interval: 60s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115
