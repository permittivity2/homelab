# homelab-dns (post-cutover #107). A freshly started PowerDNS answers every
# address of an ifportup Lua record until the first health check has run, and
# the checks only start when a record is first queried. Warm them all at every
# start: see /usr/lib/homelab-dns/homelab-dns-warm-lua. The "-" keeps a warm-up
# problem from failing pdns itself.
[Service]
ExecStartPost=-/usr/lib/homelab-dns/homelab-dns-warm-lua
