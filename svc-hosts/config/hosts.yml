# homelab-svc-hosts -- internal service names for the homelab-* fleet.
#
# These names resolve to VIP/host addresses on the 10.50 service plane and are
# MANAGED into /etc/hosts (between the "# BEGIN/END homelab-svc-hosts" markers;
# everything else in /etc/hosts is left untouched). Edit this file, then run:
#     homelab-svc-hosts-apply
#
# They are internal-only and STABLE: they always point at the internal VIP and
# never change at cutover. Only the PUBLIC FQDNs (api.mailmasker.org, ...) flip
# at cutover, and those flip in authoritative public DNS -- never here.
#
# mode:
#   hosts  (default) -- manage the /etc/hosts block from `entries` below
#   dns              -- REMOVE the /etc/hosts block and rely on an authoritative
#                       svc.homelab DNS zone instead. Set this fleet-wide once
#                       the dns tier serves svc.homelab (the convergence step).
mode: hosts

entries:
  db.svc.homelab:        10.50.2.130   # Postgres VIP (direct, migrations)
  pgbouncer.svc.homelab: 10.50.2.131   # pgbouncer VIP (app runtime DB endpoint)
  api.svc.homelab:       10.50.2.132   # api VIP (server-to-server)
