# Calendar: the per-account switches homelab-calendar keeps, reached through
# the api so myaccount and homelab-cli can show and set them, and (post-cutover
# #82) what homelab-cli needs of the calendar itself: the events in a range, a
# new event, iCalendar out and in. Sharing and the editing of one event stay on
# the web app at calendar.<domain>.
area: Calendar
order: 45
intro: >
  Your calendar through the api: the events in a range, a new event, an .ics
  file out or in, invitations (who is asked, their answers, free/busy for
  accounts here), and your calendar's own switches (the "Add to calendar"
  link in your email, the AI proposal). The calendar itself, with sharing
  and the editing of one event, lives at calendar.mailmasker.org; an
  invitation's own page is calendar.mailmasker.org/i/<token>, which needs no
  sign-in.
abilities:
  - id: calendar-account-show
    title: See your calendar switches
    method: GET
    path: /api/v1/calendar/account
    who: signed-in
    summary: Whether your inbound email gets an "Add to calendar" link, and where the AI proposal stands.
    description: >
      With the mail link on, every message delivered to any of your addresses
      gets a link at the bottom that opens calendar.<domain> with an event
      pre-filled from the message. The AI proposal is a separate switch with
      its own notice: the answer carries the notice's words and the hash you
      must send back to turn it on.
    response: |
      {
        "mail_links_enabled": true,
        "mail_links_enabled_at": "2026-11-14 16:02:11+00",
        "ai": {
          "available": true,
          "enabled": false,
          "consented_to_current_notice": false,
          "consent_at": null,
          "notice": "\"Propose with AI\" sends one email to Anthropic, a third party. ...",
          "notice_sha256": "3f1c...e9"
        },
        "settings_url": "https://calendar.mailmasker.org/settings"
      }
    notes:
      - available is false when the calendar has no AI service configured; the plain parse still works.
    cli: homelab-cli calendar account

  - id: calendar-account-set
    title: Change your calendar switches
    method: PUT
    path: /api/v1/calendar/account
    who: signed-in
    summary: Turn the email link on or off; turn the AI proposal on (with the notice's hash) or off.
    description: >
      Send only the keys you want to change. Turning the AI proposal on is a
      consent: you must send the sha256 of the notice you were shown
      (notice_sha256 from the GET). If the wording has changed since, the
      hash no longer matches and the answer is 400: read the new notice and
      send its hash. Turning it off needs nothing else.
    params:
      - name: mail_links_enabled
        in: body
        required: false
        about: true adds the link to new inbound email from now on; false stops it.
        example: true
      - name: ai_enabled
        in: body
        required: false
        about: true turns the AI proposal on (with ai_consent_sha256); false turns it off.
        example: true
      - name: ai_consent_sha256
        in: body
        required: false
        about: The hash of the notice you agreed to, from the GET's notice_sha256. Required with ai_enabled true.
        example: 3f1c3f1c3f1c3f1c3f1c3f1c3f1c3f1c3f1c3f1c3f1c3f1c3f1c3f1c3f1c3f1c
    response: |
      { "mail_links_enabled": true, "ai": { "available": true, "enabled": true, "consented_to_current_notice": true, "consent_at": "2026-11-14 16:05:00+00", "notice": "...", "notice_sha256": "3f1c...e9" }, "settings_url": "https://calendar.mailmasker.org/settings" }
    notes:
      - A stale notice hash answers 400 with a sentence saying to reload and agree again.
      - Since calendar 0.1.8 the same call also takes auto_propose (with auto_propose_consent_sha256, a third notice, from the GET's auto.notice_sha256), research_at_arrival (only for an account whose auto.research_at_arrival_allowed is true), and reminder_addresses (a list of up to 5 addresses reminders go to; empty = your account address). The GET answers with an auto object and the reminder_addresses list beside ai and research.
      - homelab-cli changes only the email link (the AI switches take a notice you read on the web page).
    cli: homelab-cli calendar account --mail-links on

  - id: calendar-admin-entitlements
    title: Grant or remove a calendar entitlement (administrators)
    method: PUT
    path: /api/v1/calendar/admin/accounts/:email/entitlements
    who: site-admin
    summary: Turn "research at arrival" on or off for an account; the person's own switch sits under it.
    description: >
      What an account is allowed beyond the defaults. Today one entitlement:
      research_at_arrival_allowed, which lets the person switch on the web
      search step for email that arrives (the "Find out more" research, run
      before any click). Taking it away also turns the person's switch off.
      Meant for a site administrator today and for the billing work later,
      which will call this when a paid option is bought or lapses.
    params:
      - name: email
        in: path
        required: true
        about: The account's address.
        example: someone@example.com
      - name: research_at_arrival_allowed
        in: body
        required: true
        about: true grants the entitlement, false removes it (and switches the feature off for the person).
        example: true
    response: |
      { "email": "someone@example.com", "entitlements": { "research_at_arrival_allowed": true } }
    notes:
      - 403 without the site_admin role; 400 when the body lacks research_at_arrival_allowed.
    cli: none

  # --- the calendar itself, for homelab-cli (post-cutover #82) ---------------
  - id: calendar-calendars-list
    title: List your calendars
    method: GET
    path: /api/v1/calendar/calendars
    who: signed-in
    summary: Your own calendars and the ones shared with you, with their ids.
    description: >
      The calendars an event can go in or be listed from: yours first, the
      default one marked, then those shared with you, each with what you may
      do in it. The answer also says which time zone your dates are read in.
    response: |
      {
        "timezone": "America/Chicago",
        "own": [
          { "id": 1, "name": "Personal", "color": "#1a73e8", "description": null, "timezone": "America/Chicago",
            "is_default": true, "permission": "owner", "visible": true, "owner_email": "{me}" }
        ],
        "shared": [
          { "id": 9, "name": "Family", "color": "#e67c73", "description": null, "timezone": "America/Chicago",
            "is_default": false, "permission": "read", "visible": true, "owner_email": "someone@example.com" }
        ]
      }
    cli: homelab-cli calendar calendars

  - id: calendar-events-list
    title: List your events
    method: GET
    path: /api/v1/calendar/events
    who: signed-in
    summary: Every occurrence in a range, today by default, a page at a time.
    description: >
      Each occurrence of each event you can see (your calendars, the ones
      shared with you, and single events shared to you) between from and to,
      in order, with wall-clock times in your calendar's zone. The two dates
      are read in that zone and may be a date, a time (2026-11-20T14:30),
      today or tomorrow. With neither you get today; with from alone, a year
      from it; with to alone, from today; a date as to means that whole day.
      Three years at most. Fifty per page unless limit says otherwise (up to
      200); the answer says how many pages there are.
    params:
      - name: from
        in: query
        required: false
        about: Where the range starts; a date, a time, today or tomorrow.
        example: today
      - name: to
        in: query
        required: false
        about: Where it ends. A date alone means through that whole day.
      - name: calendar_id
        in: query
        required: false
        about: Only this calendar (see List your calendars).
      - name: limit
        in: query
        required: false
        about: Occurrences per page, 1 to 200; 50 when left out.
      - name: page
        in: query
        required: false
        about: Which page, from 1.
    response: |
      {
        "timezone": "America/Chicago", "from": "2026-11-20T00:00:00", "to": "2026-11-21T00:00:00",
        "page": 1, "pages": 1, "limit": 50, "total": 2,
        "events": [
          { "id": 3, "occurrence": "2026-11-20T15:00:00Z", "uid": "a81b...@example.com", "title": "Stand-up", "all_day": false,
            "start": "2026-11-20T09:00:00", "end": "2026-11-20T09:15:00", "timezone": "America/Chicago", "event_timezone": "America/Chicago",
            "location": null, "description": null, "calendar": { "id": 1, "name": "Personal" },
            "permission": "owner", "is_recurring": true, "is_exception": false, "shared_event": false },
          { "id": 7, "occurrence": null, "uid": "3f9c...@example.com", "title": "Dentist", "all_day": false,
            "start": "2026-11-20T14:30:00", "end": "2026-11-20T15:30:00", "timezone": "America/Chicago", "event_timezone": "America/Chicago",
            "location": "Delta Dental", "description": null, "calendar": { "id": 1, "name": "Personal" },
            "permission": "owner", "is_recurring": false, "is_exception": false, "shared_event": false }
        ]
      }
    notes:
      - occurrence names one occurrence of a repeating event (its original start, UTC); null for a single event.
      - An all-day event's start and end are dates, the end exclusive.
      - A to before from, or a range over three years, answers 400 with a sentence.
    cli: homelab-cli calendar list --from today

  - id: calendar-events-add
    title: Add an event
    method: POST
    path: /api/v1/calendar/events
    who: signed-in
    status: 201
    summary: One new event in your default calendar, or the one you name.
    description: >
      The same body the calendar's own editor sends. Times are wall clocks in
      the zone you name (your calendar's when you don't); an all-day event
      takes dates. Without an end a timed event lasts an hour and an all-day
      one a day. A reminder is minutes before the start, by email; share_with
      makes a read-only share to one address and tells that person.
    params:
      - name: title
        in: body
        required: true
        about: What shows on the calendar.
        example: Dentist
      - name: start
        in: body
        required: true
        about: 2026-11-20T14:30:00, or a date for an all-day event.
        example: 2026-11-20T14:30:00
      - name: end
        in: body
        required: false
        about: The end, same form; for all-day dates it is exclusive.
        example: 2026-11-20T15:30:00
      - name: all_day
        in: body
        required: false
        about: true for an all-day event.
      - name: timezone
        in: body
        required: false
        about: The IANA zone the wall clocks are in; your calendar's when left out.
      - name: location
        in: body
        required: false
        about: Where.
        example: Delta Dental
      - name: description
        in: body
        required: false
        about: Notes.
      - name: calendar_id
        in: body
        required: false
        about: The calendar to add to (see List your calendars); your default one when left out.
      - name: reminder_minutes
        in: body
        required: false
        about: Minutes before the start for the email reminder (0 to 20160); null for none.
        example: 10
      - name: repeat
        in: body
        required: false
        about: An RRULE such as FREQ=WEEKLY;COUNT=4 when it repeats.
      - name: share_with
        in: body
        required: false
        about: One address to share the new event with, read-only.
      - name: pinned
        in: body
        required: false
        about: true to pin the event to its zone, so it shows that zone's clock wherever you are (calendar 0.4.0); false by default.
    response: |
      { "id": 7, "calendar_id": 1, "uid": "3f9c...@example.com", "title": "Dentist", "description": null, "location": "Delta Dental",
        "all_day": false, "event_timezone": "America/Chicago", "timezone": "America/Chicago", "pinned": false,
        "start": "2026-11-20T14:30:00", "end": "2026-11-20T15:30:00", "event_zone_start": "2026-11-20T14:30:00", "event_zone_end": "2026-11-20T15:30:00",
        "rrule": null, "repeat": null, "color": null,
        "permission": "owner", "is_recurring": false, "created_by_email": "{me}",
        "calendar": { "id": 1, "name": "Personal", "color": "#1a73e8", "owner_email": "{me}" }, "reminder_minutes": 10 }
    notes:
      - A missing title or start, an end before the start, or a zone that is not known answers 400 with a sentence.
      - A calendar you can see but not change answers 403.
      - Since calendar 0.2.0 the body may carry reminders, a list of up to three {minutes_before, channel} with channel email or webhook, instead of reminder_minutes; the answer carries both, and url, a link that opens the calendar page on the event.
    cli: homelab-cli calendar add Dentist --start 2026-11-20T14:30 --end 2026-11-20T15:30 --location "Delta Dental" --reminder 10

  - id: calendar-events-ics
    title: Get a range as iCalendar
    method: GET
    path: /api/v1/calendar/events.ics
    who: signed-in
    summary: The occurrences in a range as an .ics file, one VEVENT each.
    description: >
      The same range as List your events, as iCalendar text: every occurrence
      is its own VEVENT with UTC times, so any calendar program imports it
      without having to understand repeat rules. For a whole calendar with
      its rules kept, see Export a calendar.
    params:
      - name: from
        in: query
        required: false
        about: As in List your events.
        example: today
      - name: to
        in: query
        required: false
        about: As in List your events.
      - name: calendar_id
        in: query
        required: false
        about: Only this calendar.
    response: |
      BEGIN:VCALENDAR
      VERSION:2.0
      PRODID:-//Silver Linings LLC//homelab-calendar//EN
      BEGIN:VEVENT
      UID:3f9c...@example.com
      DTSTART:20261120T203000Z
      DTEND:20261120T213000Z
      SUMMARY:Dentist
      LOCATION:Delta Dental
      END:VEVENT
      END:VCALENDAR
    notes:
      - The answer is text/calendar, not JSON.
    cli: homelab-cli calendar export --from today --to tomorrow -o today.ics

  - id: calendar-export-ics
    title: Export a calendar
    method: GET
    path: /api/v1/calendar/export.ics
    who: signed-in
    summary: One whole calendar as .ics with its repeat rules kept.
    description: >
      Your default calendar, or the one named, as the calendar page's own
      export makes it: each event once, with its RRULE, cancelled occurrences
      as EXDATE and moved ones as their own components. This is the file to
      carry a calendar somewhere else, or to keep.
    params:
      - name: calendar_id
        in: query
        required: false
        about: The calendar to export; your default one when left out.
    response: |
      BEGIN:VCALENDAR
      VERSION:2.0
      PRODID:-//Silver Linings LLC//homelab-calendar//EN
      X-WR-CALNAME:Personal
      BEGIN:VEVENT
      UID:a81b...@example.com
      DTSTART;TZID=America/Chicago:20261120T090000
      DTEND;TZID=America/Chicago:20261120T091500
      RRULE:FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR
      SUMMARY:Stand-up
      END:VEVENT
      END:VCALENDAR
    notes:
      - The answer is text/calendar, not JSON.
    cli: homelab-cli calendar export -o personal.ics

  - id: calendar-import-ics
    title: Import an iCalendar file
    method: POST
    path: /api/v1/calendar/import
    who: signed-in
    summary: Add the events of an .ics file to a calendar; a known UID updates its event.
    description: >
      Send the file's text as the body with Content-Type text/calendar. Times
      with a TZID keep that zone, UTC times are converted to your calendar's
      zone, floating times are read in it, and VALUE=DATE makes an all-day
      event. A DURATION stands in for a missing end; a repeat rule is kept
      when this calendar can show it; EXDATE cancels those occurrences; an
      alarm set before the start becomes the email reminder. An event whose
      UID is already in one of your editable calendars is updated in place, so
      the same file twice does not duplicate. The answer says what was made,
      what was updated, and what was skipped and why.
    params:
      - name: calendar_id
        in: query
        required: false
        about: The calendar to import into; your default one when left out. Known UIDs update wherever they are.
    response: |
      { "created": 2, "updated": 1,
        "skipped": [ { "uid": "9d1e...@example.com", "reason": "one changed occurrence of a repeating event; the series itself was imported" } ],
        "events": [
          { "id": 7, "title": "Dentist", "start": "2026-11-20T14:30:00", "end": "2026-11-20T15:30:00", "all_day": false,
            "timezone": "America/Chicago", "reminder_minutes": 15, "permission": "owner", "calendar": { "id": 1, "name": "Personal" } }
        ],
        "calendar": { "id": 1, "name": "Personal", "is_default": true, "permission": "owner" } }
    notes:
      - 2 MB and 1000 events at most; a body that is not iCalendar answers 400 with a sentence.
      - With ?dry_run=1 nothing is written; the answer lists what would be created, updated or skipped (calendar 0.2.0).
      - A component with a RECURRENCE-ID (one changed occurrence) is laid over its series as an exception when the series is here; on an update, the file's EXDATEs replace the cancelled dates recorded before.
    cli: homelab-cli calendar import holidays.ics
    curl: |
      curl -s -X POST https://api.mailmasker.org/api/v1/calendar/import \
        -H "Authorization: Bearer $TOKEN" -H "Content-Type: text/calendar" \
        --data-binary @holidays.ics
    perl: |
      use Mojo::Base -strict;
      use Mojo::UserAgent;
      use Mojo::File qw(path);
      my $ua  = Mojo::UserAgent->new;
      my $res = $ua->post('https://api.mailmasker.org/api/v1/calendar/import',
        { Authorization => "Bearer $ENV{TOKEN}", 'Content-Type' => 'text/calendar' },
        path('holidays.ics')->slurp)->result;
      print $res->body, "\n";

  # --- one event, the trash, search, calendars, shares, suggestions, settings
  # (calendar 0.2.0, post-cutover #83): what homelab-cli's other verbs use -----
  - id: calendar-event-show
    title: See one event
    method: GET
    path: /api/v1/calendar/events/:id
    who: signed-in
    summary: One event by id, with its reminders and a link that opens the page on it.
    description: >
      The event as the editor sees it: wall clocks in your zone, the repeat
      rule if any, the calendar it is in, what you may do with it, its
      reminders and url, a link to the calendar page opened on that day with
      the event highlighted. For one occurrence of a repeating event add
      recurrence_id (its original start, UTC, as List your events gives it)
      and the answer also carries that occurrence.
    params:
      - name: id
        in: path
        required: true
        about: The event's id.
        example: 7
      - name: recurrence_id
        in: query
        required: false
        about: One occurrence of a repeating event, as occurrence in List your events.
    response: |
      { "id": 7, "calendar_id": 1, "uid": "3f9c...@example.com", "title": "Dentist", "description": null, "location": "Delta Dental",
        "all_day": false, "event_timezone": "America/Chicago", "timezone": "America/Denver", "pinned": false,
        "start": "2026-11-20T13:30:00", "end": "2026-11-20T14:30:00", "event_zone_start": "2026-11-20T14:30:00", "event_zone_end": "2026-11-20T15:30:00",
        "rrule": null, "repeat": null, "color": null,
        "permission": "owner", "is_recurring": false, "created_by_email": "{me}",
        "calendar": { "id": 1, "name": "Personal", "color": "#1a73e8", "owner_email": "{me}" },
        "reminder_minutes": 10, "reminders": [ { "minutes_before": 10, "channel": "email" } ],
        "url": "https://calendar.mailmasker.org/?date=2026-11-20&event=7" }
    notes:
      - An event you cannot see answers 404.
      - Since calendar 0.4.0 start and end are in your zone (timezone) and event_zone_start and event_zone_end are the same clocks in the event's own zone (event_timezone); pinned says whether the page shows the event in its own zone wherever you are. Add timeZone to the query to read the clocks in another zone.
    cli: homelab-cli calendar show 7

  - id: calendar-event-edit
    title: Change an event
    method: PATCH
    path: /api/v1/calendar/events/:id
    who: signed-in
    summary: Change any of an event's fields; for a repeating one, say which occurrences.
    description: >
      Send only the fields that change, in the same shape as Add an event.
      For a repeating event add scope: all (the default), this (one
      occurrence, which then needs recurrence_id) or following (this and the
      later ones, which splits the series). Reminders are replaced by the list
      you send.
    params:
      - name: id
        in: path
        required: true
        about: The event's id.
        example: 7
      - name: title
        in: body
        required: false
        about: A new title.
        example: Dentist (moved)
      - name: start
        in: body
        required: false
        about: A new start, a wall clock in timezone (or your zone).
        example: 2026-11-20T15:00:00
      - name: end
        in: body
        required: false
        about: A new end.
        example: 2026-11-20T16:00:00
      - name: timezone
        in: body
        required: false
        about: A new zone for the event; left out, the event keeps its own (calendar 0.4.0; earlier it took your zone).
      - name: times_zone
        in: body
        required: false
        about: The zone the start and end you send are written in, when it is not the event's own (a drag in a grid shown in another zone); the event keeps its zone, only the instant moves.
      - name: pinned
        in: body
        required: false
        about: true to pin the event to its zone (shows that zone's clock wherever you are), false to show it in your own again.
      - name: scope
        in: body
        required: false
        about: all, this or following, for a repeating event.
      - name: recurrence_id
        in: body
        required: false
        about: Which occurrence, with scope this or following.
    response: |
      { "id": 7, "title": "Dentist (moved)", "start": "2026-11-20T15:00:00", "end": "2026-11-20T16:00:00", "all_day": false,
        "timezone": "America/Chicago", "permission": "owner", "is_recurring": false,
        "calendar": { "id": 1, "name": "Personal", "color": "#1a73e8", "owner_email": "{me}" },
        "reminders": [ { "minutes_before": 10, "channel": "email" } ], "url": "https://calendar.mailmasker.org/?date=2026-11-20&event=7" }
    notes:
      - An event you may see but not change answers 403; scope this or following without recurrence_id answers 400.
    cli: homelab-cli calendar edit 7 --title "Dentist (moved)" --start 2026-11-20T15:00

  - id: calendar-event-delete
    title: Delete an event
    method: POST
    path: /api/v1/calendar/events/:id/delete
    who: signed-in
    summary: Delete an event, or one or more occurrences of a repeating one; a whole event can be restored for 30 days.
    description: >
      A whole event goes to the trash (see Restore an event). For a repeating
      event, scope this cancels one occurrence and following ends the series
      before it; both need recurrence_id.
    params:
      - name: id
        in: path
        required: true
        about: The event's id.
        example: 7
      - name: scope
        in: body
        required: false
        about: all (the default), this or following.
        example: all
      - name: recurrence_id
        in: body
        required: false
        about: Which occurrence, with scope this or following.
    response: |
      { "ok": true, "id": 7, "scope": "all", "restorable": true }
    cli: homelab-cli calendar delete 7

  - id: calendar-event-restore
    title: Restore an event
    method: POST
    path: /api/v1/calendar/events/:id/restore
    who: signed-in
    summary: Bring a deleted event back from the trash.
    description: >
      Deleted events keep for 30 days (see Your deleted events). Restoring
      puts one back as it was, with its reminders; shares removed by the
      delete stay removed.
    params:
      - name: id
        in: path
        required: true
        about: The deleted event's id.
        example: 7
    response: |
      { "id": 7, "title": "Dentist", "start": "2026-11-20T14:30:00", "end": "2026-11-20T15:30:00", "all_day": false, "permission": "owner",
        "calendar": { "id": 1, "name": "Personal", "color": "#1a73e8", "owner_email": "{me}" }, "reminders": [ { "minutes_before": 10, "channel": "email" } ] }
    notes:
      - 404 when there is no deleted event with that id; 403 when you may not change its calendar.
    cli: homelab-cli calendar restore 7

  - id: calendar-trash-list
    title: Your deleted events
    method: GET
    path: /api/v1/calendar/trash
    who: signed-in
    summary: Events deleted from your own calendars in the last 30 days, newest first.
    description: >
      What Restore an event can bring back. Only events in calendars you own.
    response: |
      { "events": [ { "id": 7, "title": "Dentist", "all_day": false, "location": "Delta Dental", "start": "2026-11-20T14:30:00", "end": "2026-11-20T15:30:00",
                      "is_recurring": false, "calendar": { "id": 1, "name": "Personal" }, "deleted_at": "2026-11-14T16:02:11" } ] }
    cli: homelab-cli calendar trash

  - id: calendar-search
    title: Search your events
    method: GET
    path: /api/v1/calendar/search
    who: signed-in
    summary: Events whose words match, nearest to now first; with related=1 also the ones the AI finds related by meaning.
    description: >
      Looks through every calendar you can see, the single events shared
      with you and the people invited to each event. Every word you type must
      appear somewhere ("hair cut" still finds "Haircut"). With related=1 and
      AI switched on in your settings, the answer also carries related: the
      events the AI considers relevant by meaning ("doctor" finds the
      infusion at the hospital), each with a short why. Each hit carries a
      url that opens the calendar page on it. Fifty literal hits at most, ten
      related.
    params:
      - name: q
        in: query
        required: true
        about: The text to look for, two characters at least.
        example: dentist
      - name: related
        in: query
        required: false
        about: 1 to also ask the AI for events related by meaning; one model call, so a second or two.
        example: 1
    response: |
      { "q": "doctor", "events": [ { "id": 7, "title": "Dentist", "location": "Delta Dental", "all_day": false, "start": "2026-11-20T14:30:00", "end": "2026-11-20T15:30:00",
                                     "is_recurring": false, "calendar": { "id": 1, "name": "Personal" }, "url": "https://calendar.mailmasker.org/?date=2026-11-20&event=7" } ],
        "ai": { "available": true, "enabled": true },
        "related": [ { "id": 9, "title": "Infusion", "location": "St Luke's Hospital", "all_day": false, "start": "2026-12-01T08:30:00", "end": "2026-12-01T11:00:00",
                       "is_recurring": false, "calendar": { "id": 1, "name": "Personal" }, "url": "https://calendar.mailmasker.org/?date=2026-12-01&event=9", "why": "a hospital visit" } ] }
    notes:
      - Fewer than two characters answers 400.
      - Without related=1 the answer has no related key; with it and AI off, related is empty and related_note says how to switch it on.
      - The ai object says whether the AI is available on this calendar and switched on for you.
    cli: homelab-cli calendar search doctor

  - id: calendar-zone-for-place
    title: The time zone of a place
    method: POST
    path: /api/v1/calendar/zone-for-place
    who: signed-in
    summary: The IANA zone an address or town keeps, read by the AI.
    description: >
      Give a place as a person would type it into an event's Location and get
      the zone it keeps, so an appointment in Kansas can be entered in Central
      time from Montana. It is the AI's reading, answered with its confidence;
      the calendar's editor shows it as a guess to check. Needs AI switched on
      in your calendar settings.
    params:
      - name: place
        in: body
        required: true
        about: The address, town, venue or region.
        example: 11849 College Blvd, Overland Park, KS 66210
    response: |
      { "place": "Overland Park, KS", "timezone": "America/Chicago", "confidence": "high" }
    notes:
      - A place too short to mean anything answers 400; AI not switched on answers 403; AI not set up on this calendar answers 503.
      - Text that names no place on Earth answers 200 with timezone null.
    cli: homelab-cli calendar zone-for-place 11849 College Blvd, Overland Park, KS 66210

  - id: calendar-calendars-create
    title: Make a calendar
    method: POST
    path: /api/v1/calendar/calendars
    who: signed-in
    status: 201
    summary: A new calendar of your own, with a colour and a zone for its events.
    description: >
      The name shows in the sidebar; the colour marks its events; the zone is
      what new events in it default to (your own zone when left out).
    params:
      - name: name
        in: body
        required: true
        about: Up to 100 characters.
        example: Family
      - name: color
        in: body
        required: false
        about: Like #1a2b3c.
      - name: timezone
        in: body
        required: false
        about: The IANA zone for new events in it.
      - name: description
        in: body
        required: false
        about: A line about it.
    response: |
      { "id": 9, "name": "Family", "color": "#6f94b8", "description": null, "timezone": "America/Chicago", "is_default": false, "permission": "owner", "visible": true, "owner_email": "{me}" }
    notes:
      - A missing name, a name over 100 characters or a colour that is not #rrggbb answers 400.
    cli: homelab-cli calendar calendars create Family

  - id: calendar-event-shares-list
    title: Who an event is shared with
    method: GET
    path: /api/v1/calendar/events/:id/shares
    who: signed-in
    summary: The accounts and links an event is shared with.
    description: >
      Each share says who (an address, or anyone with the link), what they may
      do, when it expires, and its link; a link share also has an .ics address.
    params:
      - name: id
        in: path
        required: true
        about: The event's id.
        example: 7
    response: |
      [ { "id": 12, "shared_with_email": "someone@example.com", "permission": "read", "detail": "full", "expires_at": null, "created_at": "2026-11-14 16:02:11.123456-06",
          "url": "https://calendar.mailmasker.org/e/aaaa...aaaa", "ics_url": "https://calendar.mailmasker.org/e/aaaa...aaaa.ics", "access_count": 0 } ]
    cli: homelab-cli calendar shares 7

  - id: calendar-event-share
    title: Share an event
    method: POST
    path: /api/v1/calendar/events/:id/shares
    who: signed-in
    status: 201
    summary: Share one event with an account, or make a link anyone can open.
    description: >
      With an email, that account sees the event (and may edit it with
      permission edit) in its own calendar list, and is told by email. Without
      one, the answer is a link anyone can open; detail busy shows only that
      you are busy. Only the calendar's owner may share.
    params:
      - name: id
        in: path
        required: true
        about: The event's id.
        example: 7
      - name: email
        in: body
        required: false
        about: The account to share with; leave it out for a link.
        example: someone@example.com
      - name: permission
        in: body
        required: false
        about: read (the default) or edit (accounts only).
        example: read
      - name: detail
        in: body
        required: false
        about: For a link, full (the default) or busy.
      - name: expires_days
        in: body
        required: false
        about: Days until the share ends; none when left out.
    response: |
      { "id": 12, "shared_with_email": "someone@example.com", "permission": "read", "detail": "full", "expires_at": null, "created_at": "2026-11-14 16:02:11.123456-06",
        "url": "https://calendar.mailmasker.org/e/aaaa...aaaa", "ics_url": "https://calendar.mailmasker.org/e/aaaa...aaaa.ics", "access_count": 0 }
    notes:
      - Sharing with yourself, or from a calendar you do not own, answers 400.
    cli: homelab-cli calendar share 7 --with someone@example.com

  - id: calendar-calendar-shares-list
    title: Who a calendar is shared with
    method: GET
    path: /api/v1/calendar/calendars/:id/shares
    who: signed-in
    summary: The accounts and links a whole calendar is shared with.
