      { "id": 13, "shared_with_email": "someone@example.com", "permission": "read", "detail": "full", "expires_at": null, "created_at": "2026-11-14 16:02:11.123456-06",
        "url": "https://calendar.mailmasker.org/c/aaaa...aaaa", "ics_url": "https://calendar.mailmasker.org/c/aaaa...aaaa.ics", "access_count": 0 }
    cli: homelab-cli calendar share --calendar 1 --with someone@example.com

  - id: calendar-share-revoke
    title: Remove a share
    method: POST
    path: /api/v1/calendar/shares/:id/revoke
    who: signed-in
    summary: End a share of a calendar or an event; its link stops answering.
