  - id: calendar-suggestion-dismiss
    title: Dismiss a suggestion
    method: POST
    path: /api/v1/calendar/suggestions/:token/dismiss
    who: signed-in
    summary: Take a suggestion off your list without making an event.
    description: >
      Only your list: another recipient of the same email keeps theirs. The
      email's own link still works.
    params:
      - name: token
        in: path
        required: true
        about: The suggestion's token.
        example: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    response: |
      { "ok": true }
    cli: homelab-cli calendar suggestions dismiss aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

  - id: calendar-prefs-show
    title: See your calendar settings
    method: GET
    path: /api/v1/calendar/prefs
    who: signed-in
    summary: Time zone, week start, time and date format, the view it opens in, the defaults for new events, the reminder switches.
    description: >
      Everything the calendar's Settings page shows that is yours alone
      (the email-link and AI switches are under See your calendar switches).
    response: |
      { "timezone": "America/Chicago", "week_start": 0, "time_format": "12h", "default_view": "month", "show_shared_events": true,
        "default_reminder_minutes": 10, "all_day_reminder_hour": 9, "default_duration_minutes": 60, "date_format": "mdy",
        "remind_shared": true, "webhook_url": null }
    cli: homelab-cli calendar settings

  - id: calendar-prefs-set
    title: Change your calendar settings
    method: PUT
    path: /api/v1/calendar/prefs
    who: signed-in
    summary: Send the settings you want to change; the answer is all of them.
    description: >
      week_start is 0 (Sunday), 1 (Monday) or 6 (Saturday); time_format 12h or
      24h; default_view month, week, day or agenda; date_format mdy, dmy or
      ymd; all_day_reminder_hour 0 to 23; default_duration_minutes 5 to 1440;
      default_reminder_minutes 0 to 20160; remind_shared true or false (whether
      events others share with you remind you too); webhook_url an http(s)
      address a reminder set to Webhook posts JSON to, or empty for none.
    params:
      - name: timezone
        in: body
        required: false
        about: A fixed IANA zone the calendar is shown in wherever you are, or empty for Local, the default since calendar 0.4.0 (the zone of the device you look from).
      - name: device_zone
        in: body
        required: false
        about: The zone the device you are on keeps (the page sends it when on Local); mail written while nobody is looking uses it.
      - name: date_format
        in: body
        required: false
        about: mdy, dmy or ymd.
        example: dmy
      - name: default_reminder_minutes
        in: body
        required: false
        about: Minutes before the start for a new event's reminder.
        example: 15
      - name: all_day_reminder_hour
        in: body
        required: false
        about: The hour (0 to 23) an all-day event reminds at.
      - name: default_duration_minutes
        in: body
        required: false
        about: How long a new timed event lasts when no end is given.
      - name: remind_shared
        in: body
        required: false
        about: Whether events shared with you remind you.
      - name: webhook_url
        in: body
        required: false
        about: Where a Webhook reminder posts; empty for none.
      - name: week_start
        in: body
        required: false
        about: 0, 1 or 6.
      - name: time_format
        in: body
        required: false
        about: 12h or 24h.
      - name: default_view
        in: body
        required: false
        about: month, week, day or agenda.
    response: |
      { "timezone": "America/Chicago", "week_start": 0, "time_format": "12h", "default_view": "month", "show_shared_events": true,
        "default_reminder_minutes": 15, "all_day_reminder_hour": 9, "default_duration_minutes": 60, "date_format": "dmy",
        "remind_shared": true, "webhook_url": null }
    notes:
      - A value outside its range answers 400 with a sentence.
    cli: homelab-cli calendar settings --date-format dmy --default-reminder 15

  # --- invitations (post-cutover #85) ------------------------------------------
  - id: calendar-event-attendees-list
    title: Who is invited to an event
    method: GET
    path: /api/v1/calendar/events/:id/attendees
    who: signed-in
    summary: The people asked to an event, what each answered, the counts, and your own answer.
    description: >
      Everyone who can see the event sees the list. Each person has a status
      (needs-action until they answer, then accepted, tentative or declined),
      the note they left, when and how they answered (the link in the mail,
      the web page, the CLI, or their mail program's reply), and whether their
      invitation has gone out. my_status is your own answer when you are among
      them; can_invite says whether you are the organizer (the calendar's owner).
    params:
      - name: id
        in: path
        required: true
        about: The event's id.
        example: 7
    response: |
      { "event_id": 7, "organizer": "me@example.com", "sequence": 1, "can_invite": true, "my_status": null,
        "attendees": [ { "id": 3, "email": "ann@example.com", "name": "Ann", "status": "accepted", "comment": "Bringing dessert",
                         "invited_at": "2026-11-15 10:00:00-06", "responded_at": "2026-11-15 10:30:00-06", "responded_via": "link", "invitation_sent": true } ],
        "attendee_counts": { "total": 1, "accepted": 1, "tentative": 0, "declined": 0, "waiting": 0 } }
    cli: homelab-cli calendar attendees 7

  - id: calendar-event-invite
    title: Invite people to an event
    method: POST
    path: /api/v1/calendar/events/:id/attendees
    who: signed-in
    status: 201
    summary: Ask people to an event you own; each gets an email with Yes / Maybe / No and an iCalendar request.
    description: >
      Only the calendar's owner (the organizer) invites. Each new person gets
      an invitation within a minute: a plain-text mail with three one-tap links
      and a text/calendar REQUEST part, so Gmail, Outlook and Apple Mail show
      their own Yes / Maybe / No buttons too; the link opens the invitation page
      (/i/<token>, no sign-in). An invited address that is an account here sees
      the event in its own calendar at once (a read-only share). When the event's
      time or place changes later, everyone is asked again (SEQUENCE+1); a change
      of title or notes is sent without resetting the answers; deleting the event
      sends a cancellation. The organizer is told of every answer by mail (and by
      webhook when one is set in Settings). At most 50 people per event. Also
      accepted at creation: `attendees` on POST /api/v1/calendar/events.
    params:
      - name: id
        in: path
        required: true
        about: The event's id.
        example: 7
      - name: emails
        in: body
        required: true
        about: The addresses, or "Name <address>" forms (a list).
        example: ["ann@example.com", "Bob <bob@example.com>"]
    response: |
      { "event_id": 7, "organizer": "me@example.com", "sequence": 0, "can_invite": true, "my_status": null,
        "added": [ { "id": 4, "email": "bob@example.com", "name": "Bob", "status": "needs-action", "invitation_sent": false } ],
        "already_invited": [ "ann@example.com" ],
        "attendees": [ "..." ], "attendee_counts": { "total": 2, "accepted": 1, "tentative": 0, "declined": 0, "waiting": 1 } }
    notes:
      - Inviting yourself, or from a calendar you do not own, answers 400 and 403.
      - There is no counter-proposal flow (by decision); an attendee answers yes, maybe or no, with a note.
    cli: homelab-cli calendar invite 7 ann@example.com "Bob <bob@example.com>"

  - id: calendar-event-uninvite
    title: Take someone off an event's list
    method: POST
    path: /api/v1/calendar/events/:id/attendees/:aid/remove
    who: signed-in
    summary: Remove an invited person; they get a cancellation if they had the invitation.
    description: >
      The organizer only. The person's row and their read-only share go; someone
      who was already sent the invitation gets a CANCEL so their calendar program
      removes the event.
    params:
      - name: id
        in: path
        required: true
        about: The event's id.
        example: 7
      - name: aid
        in: path
        required: true
        about: The attendee's id (from the list).
        example: 4
    response: |
      { "ok": true, "event_id": 7, "attendees": [ "..." ], "attendee_counts": { "total": 1, "accepted": 1, "tentative": 0, "declined": 0, "waiting": 0 } }
    cli: homelab-cli calendar uninvite 7 bob@example.com

  - id: calendar-event-reinvite
    title: Send an invitation again
    method: POST
    path: /api/v1/calendar/events/:id/attendees/:aid/resend
    who: signed-in
    summary: Queue the invitation to one person once more.
    description: >
      The organizer only. The same mail as the first time (with the event as
      it is now and the person's own Yes / Maybe / No links); it goes out
      within a minute. Their answer so far is kept.
    params:
      - name: id
        in: path
        required: true
        about: The event's id.
        example: 7
      - name: aid
        in: path
        required: true
        about: The attendee's id (from the list).
        example: 4
    response: |
      { "ok": true, "email": "bob@example.com" }
    cli: homelab-cli calendar reinvite 7 bob@example.com

  - id: calendar-event-rsvp
    title: Answer an invitation
    method: POST
    path: /api/v1/calendar/events/:id/rsvp
    who: signed-in
    summary: Your own answer to an event you were invited to (it is in your calendar as a shared event).
    description: >
      For an account here that was invited. The organizer is told. People
      without an account answer through the link in their mail (/i/<token>) or
      their mail program's own buttons.
    params:
      - name: id
        in: path
        required: true
        about: The event's id.
        example: 7
      - name: answer
        in: body
        required: true
        about: yes, maybe or no (also accepted, tentative, declined).
        example: yes
      - name: comment
        in: body
        required: false
        about: A note for the organizer (500 characters at most).
        example: Running ten minutes late
    response: |
      { "ok": true, "event_id": 7, "status": "accepted", "comment": "Running ten minutes late", "organizer": "owner@example.com", "my_status": "accepted",
        "attendees": [ "..." ], "attendee_counts": { "total": 2, "accepted": 1, "tentative": 0, "declined": 0, "waiting": 1 } }
    notes:
      - An account that is not on the event's list is answered 404.
    cli: homelab-cli calendar rsvp 7 yes --comment "Running ten minutes late"

  - id: calendar-freebusy
    title: Free/busy for accounts here
    method: GET
    path: /api/v1/calendar/freebusy
    who: signed-in
    summary: Whether people with calendars here are busy in a window; bare intervals, no titles.
    description: >
      For each address: known says whether it has a calendar here at all; busy
      whether any timed event on its own calendars overlaps the window, with the
      bare intervals (all-day events count as free). Nothing else about the
      events is shown. At most 20 addresses and 31 days.
    params:
      - name: emails
        in: query
        required: true
        about: Comma-separated addresses.
        example: ann@example.com,bob@example.com
      - name: start
        in: query
        required: true
        about: The window's start, a wall clock in the zone given.
        example: 2026-11-20T13:00:00
      - name: end
        in: query
        required: false
        about: The window's end; an hour after the start when left out.
        example: 2026-11-20T14:00:00
      - name: timezone
        in: query
        required: false
        about: The IANA zone the wall clocks are in (your calendar's when left out).
        example: America/Chicago
    response: |
      { "timezone": "America/Chicago", "start": "2026-11-20T13:00:00", "end": "2026-11-20T14:00:00",
        "people": [ { "email": "ann@example.com", "known": true, "busy": true, "intervals": [ { "start": "2026-11-20T12:30:00", "end": "2026-11-20T13:30:00" } ] },
                    { "email": "bob@example.com", "known": false, "busy": false, "intervals": [] } ] }
    cli: homelab-cli calendar freebusy ann@example.com bob@example.com --start 2026-11-20T13:00
