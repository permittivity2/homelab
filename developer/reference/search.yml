# One search over your mail, your files and your calendar. See README.md for the fields.
area: Search
order: 70
intro: >
  Search your email, your files and your calendar together. Mail and files
  are looked up in a copy that is kept up to date in the background, so
  something that has only just arrived can take a little while to show up;
  events come straight from the calendar.

abilities:
  - id: search
    title: Search your mail, files and calendar
    method: GET
    path: /api/v1/search
    who: signed-in
    summary: Find email, files and calendar events by words, people, dates or type, in one search.
    description: >
      Mail matches on its subject and text, files on their name and text;
      with `q` the best matches come first, otherwise the newest. Results
      come in two lists, `mail` and `drive`, each up to `limit` long. Files
      someone has shared with you are included, with their address in
      `shared_by`. `filters` shows how your request was read, and
      `indexed` is false until something of yours has been indexed.
      Events come in a third object, `calendar`: the ones whose words match
      in `events`, and, when you ask with `related=1` and that account has
      AI on in the calendar, the ones its AI finds related by meaning in
      `related`, each with a `why`. The calendar is matched by words only;
      the other filters are about mail and files. `calendar` is null when
      the calendar was not asked.
    params:
      - name: q
        in: query
        required: false
        about: Words to find. Put a phrase in double quotes, use OR between words for either one, and a minus before a word to leave it out.
        example: invoice
      - name: person
        in: query
        required: false
        about: A name or address. Finds mail from or to them, and photos they are tagged in.
      - name: from
        in: query
        required: false
        about: Only items dated on or after this day, as YYYY-MM-DD.
      - name: to
        in: query
        required: false
        about: Only items dated on or before this day, as YYYY-MM-DD.
      - name: source
        in: query
        required: false
        about: both (the default; mail and files, with the calendar unless calendar=0), mail, drive, calendar (events only) or all.
      - name: calendar
        in: query
        required: false
        about: 1 or 0, whether the calendar is searched too. On with both, all and calendar; off with mail or drive unless you say 1.
      - name: related
        in: query
        required: false
        about: 1 to also ask the calendar for events related by meaning. One AI call, made only when that account has AI on in the calendar; otherwise `related` is empty and `related_note` says why.
      - name: mailbox
        in: query
        required: false
        about: Only mail in this folder, spelled as the results' `mailbox` shows it, such as INBOX.
      - name: has_attachments
        in: query
        required: false
        about: 1 for only mail that has attachments.
      - name: mime
        in: query
        required: false
        about: Only files of this type, such as image or application/pdf.
      - name: type_in
        in: query
        required: false
        about: Only these types, repeated for more than one. A group (cat:pictures), a whole kind (image/*) or one type (image/png). For mail it matches the attachments.
      - name: type_ex
        in: query
        required: false
        about: Leave these types out, written the same way as type_in.
      - name: tag
        in: query
        required: false
        about: Only photos with this tag, or a tag filed under it.
      - name: shared
        in: query
        required: false
        about: What to do with files others have shared with you. include (the default), exclude, or only.
      - name: in_trash
        in: query
        required: false
        about: 1 to search your deleted files instead.
      - name: min_size
        in: query
        required: false
        about: Only files of at least this many bytes.
      - name: max_size
        in: query
        required: false
        about: Only files of at most this many bytes.
      - name: limit
        in: query
        required: false
        about: The most results from mail, and from files. 50 if you leave it out, 200 at most.
      - name: offset
        in: query
        required: false
        about: Skip this many results first, to get the next page.
    response: |
      {
        "account": "{me}",
        "indexed": true,
        "filters": {
          "q": "invoice", "person": "", "from": "", "to": "", "mailbox": "",
          "mime": "", "tag": "", "shared": "include", "source": "both",
          "calendar": 1, "related": 1,
          "type_in": [], "type_ex": [], "in_trash": 0, "has_attachments": 0,
          "limit": 50, "offset": 0
        },
        "calendar": {
          "ok": 1,
          "events": [
            {
              "id": 31,
              "title": "Invoice review with Dana",
              "location": "Room 4",
              "calendar": "My calendar",
              "start": "2026-11-18T10:00:00",
              "end": "2026-11-18T10:30:00",
              "all_day": 0,
              "is_recurring": 0,
              "when": "Wed, Nov 18 · 10:00 – 10:30 AM",
              "url": "https://calendar.mailmasker.org/?date=2026-11-18&event=31"
            }
          ],
          "related": [
            {
              "id": 27,
              "title": "Call the accountant",
              "location": "",
              "calendar": "My calendar",
              "start": "2026-11-20T15:00:00",
              "end": "2026-11-20T15:30:00",
              "all_day": 0,
              "is_recurring": 0,
              "when": "Fri, Nov 20 · 3:00 – 3:30 PM",
              "url": "https://calendar.mailmasker.org/?date=2026-11-20&event=27",
              "why": "about money owed"
            }
          ],
          "related_note": null,
          "ai": { "available": 1, "enabled": 1 }
        },
        "mail": [
          {
            "message_id": 4182,
            "subject": "Your November invoice",
            "sent_at": "2026-11-03 21:42:10-06",
            "received_at": "2026-11-03 21:42:12-06",
            "size_bytes": 48211,
            "has_attachments": 1,
            "is_seen": 1,
            "mailbox": "INBOX",
            "rank": 0.4,
            "from_addr": "billing@example.com",
            "from_name": "Example Billing",
            "snippet": "Thanks for your order. Your invoice for November is attached."
          }
        ],
        "drive": [
          {
            "drive_item_id": 913,
            "drive_file_id": 2207,
            "file_uuid": "6f1c2a9e-3b4d-4c5e-9f70-1a2b3c4d5e6f",
            "file_name": "invoice-october.pdf",
            "folder_path": "Bills",
            "size_bytes": 88340,
            "uploaded_at": "2026-11-02 08:15:30.402113-06",
            "content_created_at": null,
            "deleted_at": null,
            "mime_type": "application/pdf",
            "rank": 0.2,
            "snippet": "Invoice for October. Amount due"
          }
        ]
      }
    notes:
      - With no words and no filter, nothing is searched and both lists come back empty. Choosing only a `source` doesn't count as a filter.
      - Calendar results come live from the calendar, so they need no indexing. `when` is the day and time in your own zone, `url` opens the event in the calendar. The calendar needs at least two characters in `q`, and `calendar` is null when there were none; `ok` is 0, with an `error`, when the calendar could not be asked.
      - A mail result's `message_id` is the search's own number for it, not the `uid` that Read a message takes.
      - Files you have kept out of search (marked private in drive, alone or by their folder) never come back.
    cli: homelab-cli search invoice
