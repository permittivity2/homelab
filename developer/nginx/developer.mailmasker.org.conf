# developer.mailmasker.org -- the MailMasker API reference (homelab-developer).
#
# Plain files built when the package was, under /usr/share/homelab-developer/
# site. TLS ends at the edge, which passes the request on to here over plain
# HTTP, as it does for the other sites on this host. The visitor's address
# comes from conf.d/real-ip-from-edge.conf.
#
# Pages are linked as /name and kept as name.html (try_files below). Every
# page is also Markdown at /name.md, read by tools and AI assistants such as
# the Claude Code skill (/skill/SKILL.md), and indexed by /llms.txt.
server {
    listen 80;
    server_name developer.mailmasker.org;
    root /usr/share/homelab-developer/site;
    index index.html;

    charset utf-8;
    charset_types text/html text/plain text/markdown application/json;

    access_log /var/log/nginx/developer.access.log;
    error_log  /var/log/nginx/developer.error.log;

    # Short, so a new release shows within minutes. (add_header in a
    # location replaces these, so the one below repeats them.)
    add_header Cache-Control "public, max-age=300" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # The files for tools: UTF-8 text, and readable from any web page too
    # (they are public anyway). nginx has no type for .md of its own.
    location ~ \.(?:md|txt|json)$ {
        default_type text/markdown;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
