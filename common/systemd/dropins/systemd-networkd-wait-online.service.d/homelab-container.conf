# homelab-common (post-cutover #108). Links Proxmox attaches disconnected
# (link_down=1 -- planes a node does not use) never get carrier, so waiting for
# EVERY link to be routable waited the full two minutes at every container
# boot, failed, and held everything after network-online.target (the homelab
# services among it) for as long. homelab-wait-online runs the stock binary
# with --any inside a container (online = one link routable) and unchanged
# anywhere else.
[Service]
ExecStart=
ExecStart=/usr/bin/homelab-wait-online
