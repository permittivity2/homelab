# homelab-common (post-cutover #110). logrotate runs once a DAY by default, so
# the `maxsize 200M` homelab-common ships (/etc/logrotate.d/00-homelab-maxsize,
# #105) only bounds a flooding log at that daily run -- and a day is enough to
# fill a root disk (it did: #105 filled prod-homelab39, #110 nearly filled
# prod-homelab12). Run logrotate HOURLY: a log's own daily/weekly schedule is
# unchanged (logrotate tracks last-rotation per log), but a log past 200M is
# now caught within the hour. A flooding log then keeps ~4 hours of history
# instead of 4 days -- that is the point. The journal is separately size-capped
# (SystemMaxUse), so this is about the rsyslog text files that actually fill /.
[Timer]
OnCalendar=
OnCalendar=hourly
RandomizedDelaySec=15m
