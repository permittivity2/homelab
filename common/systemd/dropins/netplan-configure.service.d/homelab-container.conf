# homelab-common (post-cutover #108). Inside an LXC container netplan has
# nothing to configure -- Proxmox writes /etc/systemd/network/ethN.network for
# the container -- and the unit's "udevadm control --reload" fails there (no
# udev), so every container booted "degraded". The unit is skipped in
# containers; VMs keep it as shipped by netplan.
[Unit]
ConditionVirtualization=!container
