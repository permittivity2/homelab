# Managed by homelab-node-exporter. Enables node_exporter's textfile
# collector so the homelab Mojolicious apps can publish per-app HTTP
# metrics as *.prom files here (written by Homelab::Common::Health's
# mount_metrics_route), aggregated + exposed on :9100 with no extra port.
#
# HOMELAB_COLLECTOR_ARGS comes from /etc/homelab/node-exporter/collectors
# (seeded on install from the package's example, per-host editable). By
# default it turns OFF the zfs and systemd collectors -- that file says why
# (on this fleet they were 57% of every series Prometheus held).
[Service]
EnvironmentFile=-/etc/homelab/node-exporter/collectors
ExecStart=
ExecStart=/usr/bin/prometheus-node-exporter --collector.textfile.directory=/var/lib/prometheus/node-exporter $HOMELAB_COLLECTOR_ARGS $ARGS
