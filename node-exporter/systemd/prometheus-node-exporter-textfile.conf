# Managed by homelab-node-exporter. Enables node_exporter's textfile
# collector so the homelab Mojolicious apps can publish per-app HTTP
# metrics as *.prom files here (written by Homelab::Common::Health's
# mount_metrics_route), aggregated + exposed on :9100 with no extra port.
[Service]
ExecStart=
ExecStart=/usr/bin/prometheus-node-exporter --collector.textfile.directory=/var/lib/prometheus/node-exporter $ARGS
