# Managed by homelab-dovecot-metrics. Enables Dovecot 2.4's native
# openmetrics endpoint (:9900/metrics) + a few high-value metrics, scraped
# by homelab-prometheus. A new listener only -- does not touch IMAP/LMTP.
service stats {
  inet_listener http {
    port = 9900
  }
}
metric auth_success {
  filter = event=auth_request_finished
}
metric imap_command {
  filter = event=imap_command_finished
}
metric smtp_command {
  filter = event=smtp_server_command_finished
}
