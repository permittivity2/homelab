# Placed by install-orchestrators/badips-orchestrate.sh --static-realip on
# prod-homelab45 (the static-site and apt-repo host), whose site files were
# made by hand in the October 2026 vhost move and are managed by no package.
# This is the one hand-managed exception to "every setup step is packaged",
# and it is kept here so it is reproducible.
#
# http-level, so it covers every site on the host without touching the
# hand-made site files. The edge (homelab-webproxy) appends the real
# visitor's address to X-Forwarded-For; it is believed ONLY from the edge
# nodes (prod-homelab00/01/02 and their shared service address .140), so
# nginx's access log here names the visitor instead of the edge.
set_real_ip_from 10.50.2.140;
set_real_ip_from 10.50.2.144;
set_real_ip_from 10.50.2.145;
set_real_ip_from 10.50.2.146;
real_ip_header X-Forwarded-For;
real_ip_recursive on;
