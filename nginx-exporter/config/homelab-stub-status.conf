# Managed by homelab-nginx-exporter. Internal-only stub_status endpoint
# that prometheus-nginx-exporter scrapes locally (loopback); never exposed
# publicly. Included via nginx's /etc/nginx/conf.d/*.conf.
server {
    listen 127.0.0.1:8099;
    server_name _;
    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
}
