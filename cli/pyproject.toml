[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-cli"
version = "0.1.0"
description = "Command-line client for homelab-api"
requires-python = ">=3.10"
dependencies = ["requests", "PyYAML"]

[project.scripts]
homelab-cli = "homelab_cli.cli:main"

[tool.setuptools]
packages = ["homelab_cli"]
